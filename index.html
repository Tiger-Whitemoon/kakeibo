<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<title>家計簿</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f6f5c'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif'%3E%C2%A5%3C/text%3E%3C/svg%3E">
<style>
/* 家計簿 — PC・スマホ両対応 */
:root {
  --bg: #f4f5f2;
  --card: #ffffff;
  --ink: #1d2320;
  --ink2: #5b6560;
  --line: #e2e5e0;
  --line2: #eef0ec;
  --accent: #1f6f5c;
  --accent-soft: #e3f0eb;
  --inc: #17803d;
  --exp: #c2402f;
  --warn: #9a6200;
  --warn-soft: #fff4dc;
  --bad: #b42318;
  --bad-soft: #fde8e6;
  --radius: 10px;
  --nav-h: 52px;
  font-size: 15px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
  line-height: 1.55;
  font-feature-settings: "tnum" 1;
}
a { color: var(--accent); }
h1 { font-size: 1.35rem; margin: 0; }
h2 { font-size: 1.08rem; margin: 0 0 10px; }
h3 { font-size: .95rem; margin: 18px 0 8px; color: var(--ink2); }
.muted { color: var(--ink2); }
.neg { color: var(--bad); }
.inc { color: var(--inc); }
.exp { color: var(--exp); }
.ok-text { color: var(--inc); font-weight: 600; }
.nowrap { white-space: nowrap; }
.r { text-align: right; }
[hidden] { display: none !important; }

/* ---------- ヘッダー・ナビ ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 18px;
  background: var(--accent); color: #fff; padding: 0 20px; height: var(--nav-h);
  box-shadow: 0 1px 0 rgba(0,0,0,.08);
}
.brand { color: #fff; text-decoration: none; font-weight: 700; font-size: 1.1rem; white-space: nowrap; }
.brand span { font-size: .7rem; font-weight: 600; background: rgba(255,255,255,.2); border-radius: 4px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }
#nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
#nav::-webkit-scrollbar { display: none; }
#nav a { color: rgba(255,255,255,.85); text-decoration: none; padding: 7px 12px; border-radius: 8px; white-space: nowrap; font-size: .92rem; }
#nav a:hover { background: rgba(255,255,255,.12); color: #fff; }
#nav a.active { background: #fff; color: var(--accent); font-weight: 700; }

main { max-width: 1080px; margin: 0 auto; padding: 18px 16px 110px; }
.loading { color: var(--ink2); }

/* ---------- カード・レイアウト ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.card-head h2 { margin: 0; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.cols > .card { margin-bottom: 0; }
.cols + .card, .cols + .cols { margin-top: 16px; }
.cols { margin-bottom: 16px; }
.pager { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 2px 0 14px; }
.notice { background: var(--accent-soft); border: 1px solid #c4dfd5; border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; }
.notice.warn { background: var(--warn-soft); border-color: #f0d9a6; }
.notice.bad { background: var(--bad-soft); border-color: #f5c2bc; margin: 0; border-radius: 0; text-align: center; }
.empty { color: var(--ink2); margin: 8px 0; }
.error { color: var(--bad); }
.setup { max-width: 640px; margin: 24px auto; }
.setup h1 { margin-bottom: 8px; }

/* ---------- 表 ---------- */
table { border-collapse: collapse; width: 100%; }
.list th, .list td { padding: 8px 8px; border-bottom: 1px solid var(--line2); vertical-align: top; }
.list thead th { font-size: .8rem; font-weight: 600; color: var(--ink2); text-align: left; border-bottom: 1px solid var(--line); }
.list thead th.r { text-align: right; }
.list tr.clickable { cursor: pointer; }
.list tr.clickable:hover td { background: #f7f9f6; }
.list .total td { font-weight: 700; border-top: 1px solid var(--line); }
.list tr.archived td { color: var(--ink2); }
.kv th, .kv td { padding: 7px 4px; border-bottom: 1px solid var(--line2); }
.kv th { text-align: left; font-weight: 500; }
.kv tr.total th, .kv tr.total td { font-weight: 700; border-top: 1px solid var(--line); border-bottom: none; }
.sub { font-size: .8rem; color: var(--ink2); }
.amt { font-weight: 600; white-space: nowrap; }
.amt.neg, .amt.exp { color: var(--exp); }
.amt.inc { color: var(--inc); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.tag { display: inline-block; font-size: .72rem; line-height: 1.5; padding: 0 6px; border-radius: 4px; background: var(--line2); color: var(--ink2); font-weight: 500; white-space: nowrap; vertical-align: 1px; }
.tag.est { background: #eef1fb; color: #3b55a5; }
.tag.bad { background: var(--bad-soft); color: var(--bad); font-weight: 700; }
.tag.kind { font-weight: 400; }
.actions-cell { white-space: nowrap; }
.actions-cell .btn { margin-left: 4px; }
.scroll { overflow-x: auto; }
.wide-num td, .wide-num th { font-size: .82rem; padding: 6px 6px; white-space: nowrap; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 6px 0 4px; }
.stats div { background: #f7f9f6; border-radius: 8px; padding: 8px 10px; }
.stats span { display: block; font-size: .78rem; color: var(--ink2); }
.stats b { font-size: 1.05rem; white-space: nowrap; }
.bars td { vertical-align: middle; }
.bars .bar-cell { width: 45%; }
.bar { display: block; height: 10px; border-radius: 5px; min-width: 2px; opacity: .85; }

/* 出納帳 */
.ledger td { font-size: .9rem; }
.ledger tr.carry td { background: #f7f9f6; font-weight: 600; }
.ledger tr.subtotal td { background: #fbfbf9; font-weight: 600; font-size: .85rem; border-top: 1px solid var(--line); }
.ledger tr.cumtotal td { color: var(--ink2); font-size: .82rem; }
.ledger tr.gap td { background: var(--warn-soft); }
.ledger .mark-col { width: 64px; }
.mark { font-size: .72rem; white-space: nowrap; font-weight: 700; }
.mark.ok { color: var(--inc); }
.mark.bad { color: var(--bad); }

/* 引き落とし */
details.wd { border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; }
details.wd > summary { display: flex; gap: 14px; align-items: center; padding: 10px 12px; cursor: pointer; flex-wrap: wrap; }
details.wd > table { margin: 0 0 6px; }
.wd-date { font-weight: 600; min-width: 9em; }
.wd-total { font-weight: 700; font-size: 1.05rem; }
details.past > summary { cursor: pointer; color: var(--ink2); margin: 12px 0 6px; }

/* ---------- フォーム ---------- */
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; min-width: 0; }
.field > span:first-child { font-size: .8rem; font-weight: 600; color: var(--ink2); }
input:not([type]), input[type=text], input[type=tel], input[type=search], input[type=date], select {
  font: inherit; color: var(--ink); background: #fff; border: 1px solid #cfd5cf; border-radius: 8px;
  padding: 8px 10px; min-height: 40px; width: 100%;
}
input[type=color] { width: 56px; height: 40px; border: 1px solid #cfd5cf; border-radius: 8px; padding: 2px; background: #fff; }
input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.err { color: var(--bad); font-weight: 600; }
.warn { color: var(--warn); }
.hint { color: var(--ink2); font-size: .82rem; }
.check { display: flex; gap: 8px; align-items: center; margin: 4px 0 12px; }
.check input { width: 18px; height: 18px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 0 12px; align-items: flex-end; }
.filters .field { margin-bottom: 4px; }
.filters .grow { flex: 1 1 180px; }
.range { display: flex; align-items: center; gap: 6px; }
.range input { width: auto; }
.seg { display: flex; border: 1px solid #cfd5cf; border-radius: 9px; overflow: hidden; margin-bottom: 14px; }
.seg label { flex: 1; position: relative; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; text-align: center; padding: 8px 6px; cursor: pointer; font-weight: 600; color: var(--ink2); border-left: 1px solid #cfd5cf; }
.seg label:first-child span { border-left: none; }
.seg input:checked + span { background: var(--accent); color: #fff; }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -3px; }
.seg.small { margin-bottom: 0; }
.seg.small span { font-size: .8rem; padding: 9px 4px; }
.amount-row { display: flex; gap: 6px; }
.amount-row input { flex: 1; min-width: 0; }
.sign-btn { flex: none; padding: 6px 10px; font-weight: 700; }
.wd-missing { color: var(--bad); font-size: .82rem; font-weight: 600; margin-top: 2px; }
.wd-missing-sum { background: var(--bad-soft); border-radius: 8px; padding: 8px 12px; margin: 0 0 8px; font-size: .9rem; }
.list tr.row-warn td { background: #fff8f7; }
.preview { background: #f7f9f6; border-radius: 8px; padding: 8px 12px; margin: -4px 0 12px; font-size: .9rem; }
.preview:empty { display: none; }

.btn {
  font: inherit; font-weight: 600; border: 1px solid #cfd5cf; background: #fff; color: var(--ink);
  border-radius: 8px; padding: 8px 14px; cursor: pointer; min-height: 40px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
}
.btn:hover { background: #f4f6f3; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #185a4a; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.danger-ghost { color: var(--bad); border-color: #f0b8b1; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.small { padding: 4px 10px; min-height: 32px; font-size: .85rem; }
.btn:disabled { opacity: .35; cursor: default; }
.icon-btn { border: none; background: none; font-size: 1.5rem; line-height: 1; cursor: pointer; color: var(--ink2); padding: 4px 8px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 14px; flex-wrap: wrap; }
.actions.left { justify-content: flex-start; }
.actions .spacer { flex: 1; }
.tools { display: flex; gap: 6px; }

#fab {
  position: fixed; right: max(20px, calc(50vw - 520px)); bottom: 24px; z-index: 30;
  width: 58px; height: 58px; border-radius: 50%; border: none; background: var(--accent); color: #fff;
  font-size: 2rem; line-height: 1; cursor: pointer; box-shadow: 0 6px 18px rgba(31,111,92,.35);
}
#fab:hover { background: #185a4a; }

/* ---------- ダイアログ ---------- */
dialog { border: none; border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 32px); box-shadow: 0 18px 50px rgba(0,0,0,.25); color: var(--ink); }
dialog::backdrop { background: rgba(20,28,24,.45); }
dialog.confirm { width: min(420px, calc(100vw - 32px)); }
.dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px 4px; }
.dlg-head h2 { margin: 0; }
.dlg-body { padding: 10px 18px 18px; }
.confirm-msg { margin: 6px 0 4px; }

#toast {
  position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 20px); z-index: 100;
  background: #1d2320; color: #fff; padding: 10px 18px; border-radius: 10px; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); font-size: .92rem;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.error { background: var(--bad); }

.print-only { display: none; }
.show-sm { display: none; }

/* ---------- スマホ ---------- */
@media (max-width: 760px) {
  :root { font-size: 15px; }
  .topbar { height: auto; padding: 0; flex-direction: column; align-items: stretch; gap: 0; }
  .brand { padding: 10px 14px 4px; }
  #nav { padding: 4px 8px 8px; }
  main { padding: 12px 10px 110px; }
  .card { padding: 14px 12px; }
  .cols { grid-template-columns: 1fr; }
  .grid2 { grid-template-columns: 1fr; }
  .hide-sm { display: none; }
  .show-sm { display: block; }
  .stats b { font-size: .95rem; }
  .filters .field { flex: 1 1 140px; }
  .range input { min-width: 0; flex: 1; }
  .actions-cell { white-space: normal; }
  .actions-cell .btn { margin: 2px 0 2px 4px; }
  #fab { right: 16px; bottom: 18px; }
  dialog { max-height: calc(100vh - 16px); }
  .dlg-body { padding: 8px 14px 14px; }
  .ledger { min-width: 620px; }
  .ledger td, .ledger th { font-size: .82rem; padding: 6px 5px; }
}

/* ---------- 印刷（A4縦） ---------- */
@page { size: A4 portrait; margin: 14mm 12mm; }
@page wide { size: A4 landscape; margin: 12mm 10mm; }
@media print {
  body { background: #fff; font-size: 10pt; }
  .no-print, .topbar, #fab, #toast, .tools, .card-head h2, .hint { display: none !important; }
  .print-only { display: block; }
  main { max-width: none; padding: 0; }
  .card { border: none; padding: 0; margin: 0 0 8mm; }
  .cols { display: block; }
  h1.print-only, .print-head h1 { font-size: 14pt; margin-bottom: 2mm; }
  .print-head p { margin: 0 0 3mm; }
  body.printing-section main > *:not(.print-target):not(.cols) { display: none !important; }
  body.printing-section .cols > *:not(.print-target) { display: none !important; }
  body.printing-section .cols:not(:has(.print-target)) { display: none !important; }
  .print-wide { page: wide; }
  .scroll { overflow: visible; }
  thead { display: table-header-group; }
  tr { page-break-inside: avoid; }
  .list th, .list td { padding: 3px 4px; border-bottom: 0.5pt solid #999; }
  .list thead th { border-bottom: 1pt solid #333; color: #000; }
  .tag.est { border: 0.5pt solid #3b55a5; background: none; }
  .dot { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .bar { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .ledger tr.carry td, .ledger tr.subtotal td { background: none; }
  a { color: inherit; text-decoration: none; }
}

</style>
</head>
<body>
<header class="topbar no-print">
  <a class="brand" href="#home">家計簿<span>試用版</span></a>
  <nav id="nav" aria-label="画面"></nav>
</header>
<div id="banner" class="notice bad no-print" hidden></div>
<main id="app"><p class="loading">読み込み中…</p></main>
<button id="fab" class="no-print" aria-label="取引を入力" title="取引を入力" hidden>＋</button>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* 共通ユーティリティ（画面にも保存にも依存しない） */
(function (KB) {
  'use strict';
  const U = (KB.util = {});

  U.pad = (n) => String(n).padStart(2, '0');

  U.todayStr = () => {
    const d = new Date();
    return `${d.getFullYear()}-${U.pad(d.getMonth() + 1)}-${U.pad(d.getDate())}`;
  };

  // 'YYYY-MM-DD' <-> 通し日数（UTC基準なので時差の影響なし）
  U.dayNum = (s) => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 864e5;
  U.fromDayNum = (n) => new Date(n * 864e5).toISOString().slice(0, 10);
  U.addDays = (s, k) => U.fromDayNum(U.dayNum(s) + k);
  U.isValidDate = (s) =>
    typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && U.fromDayNum(U.dayNum(s)) === s;

  U.monthStart = (y, m) => `${y}-${U.pad(m)}-01`;
  U.monthEnd = (y, m) => U.fromDayNum(Date.UTC(y, m, 0) / 864e5);
  U.ym = (s) => s.slice(0, 7);

  U.uuid = () => {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
      const r = (Math.random() * 16) | 0;
      return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
    });
  };
  U.now = () => new Date().toISOString();

  U.num = (v) => (v == null ? '' : (v < 0 ? '−' : '') + Math.abs(v).toLocaleString('ja-JP'));
  U.yen = (v) => (v == null ? '不明' : U.num(v) + '円');

  const WD = ['日', '月', '火', '水', '木', '金', '土'];
  U.weekday = (s) => WD[new Date(U.dayNum(s) * 864e5).getUTCDay()];
  U.md = (s) => `${+s.slice(5, 7)}/${+s.slice(8, 10)}`;
  U.ymd = (s) => `${s.slice(0, 4)}/${+s.slice(5, 7)}/${+s.slice(8, 10)}`;
  U.mdw = (s) => `${U.md(s)}（${U.weekday(s)}）`;

  U.esc = (s) =>
    String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
    );

  /** 数字欄用：全角数字・全角記号を半角に直す（入力中に使う） */
  U.toHalfNum = (s) =>
    String(s)
      .replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0))
      .replace(/[，、]/g, ',')
      .replace(/[−－ー‐―]/g, '-')
      .replace(/＋/g, '+')
      .replace(/[\u3000]/g, ' ');

  /** 名前欄用：半角カナ（ｻｲﾌ）を全角（サイフ）に揃える。他の文字はそのまま */
  U.toFullKana = (s) => String(s).replace(/[\uff61-\uff9f]+/g, (m) => m.normalize('NFKC'));

  /** 名前・メモの整形：前後の空白を除き、半角カナを全角に */
  U.cleanText = (s) => U.toFullKana(String(s == null ? '' : s)).trim();

  U.MAX_AMOUNT = 999999999; // 9億9,999万9,999円

  /** 金額入力を整数に直す。全角数字・カンマ・「円」・各種マイナス記号を受け付ける */
  U.parseAmount = (str, opts) => {
    const allowNegative = !!(opts && opts.allowNegative);
    let s = String(str == null ? '' : str)
      .trim()
      .replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0))
      .replace(/[,，、\s円]/g, '')
      .replace(/^[−－ー‐―-]/, '-')
      .replace(/^[＋+]/, '');
    if (s === '') return { error: '金額を入力してください' };
    if (!/^-?\d+$/.test(s)) return { error: '数字で入力してください' };
    const v = parseInt(s, 10);
    if (Math.abs(v) > U.MAX_AMOUNT) return { error: '金額が大きすぎます（上限 9億9,999万9,999円）' };
    if (!allowNegative && v < 1) return { error: '1円以上で入力してください' };
    return { value: v };
  };

  /** CSV（Excelで文字化けしないよう BOM付きUTF-8） */
  U.csv = (rows) => {
    const cell = (v) => {
      if (v == null) return '';
      const s = String(v);
      return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    return '﻿' + rows.map((r) => r.map(cell).join(',')).join('\r\n') + '\r\n';
  };

  /**
   * ファイルを保存する。claude.ai の中で動いているときは、その保存機能（downloads）を使う。
   * 戻り値：'saved' / 'declined' / 'error'
   */
  U.inViewer = () => typeof window !== 'undefined' && !!(window.claude && typeof window.claude.use === 'function');
  U.download = async (filename, text, mime) => {
    try {
      if (U.inViewer()) {
        const dl = await window.claude.use('downloads');
        if (dl) {
          try {
            await dl.save({ filename, data: text });
            return 'saved';
          } catch (e) {
            if (e && e.code === 'declined') return 'declined';
            throw e;
          }
        }
      }
      U._anchorDownload(filename, text, mime);
      return 'saved';
    } catch (e) {
      console.error(e);
      if (KB.ui) KB.ui.toast('ファイルを保存できませんでした（' + ((e && (e.message || e.code)) || e) + '）', 'error');
      return 'error';
    }
  };
  U._anchorDownload = (filename, text, mime) => {
    const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      URL.revokeObjectURL(a.href);
      a.remove();
    }, 1000);
  };

  U.sum = (arr, f) => arr.reduce((s, x) => s + (f ? f(x) : x), 0);

   * 時点キー = 通し日数 × 10 + 並び順
   *   0: 朝チェックポイントの調整取引
   *   1: 朝チェックポイント
   *   2: その日の通常取引（収入・支出・振替・カード引き落とし）

   *   4: 夜チェックポイント

  B.txKey = (date) => U.dayNum(date) * 10 + 2;

    !!(acc && acc.kind === 'credit' && acc.settlementAccountId && accById.has(acc.settlementAccountId));

    a.date < b.date ? -1 : a.date > b.date ? 1 :
    (a.createdAt || '') < (b.createdAt || '') ? -1 : (a.createdAt || '') > (b.createdAt || '') ? 1 :
    a.id < b.id ? -1 : a.id > b.id ? 1 : 0;

   * data = { accounts, categories, transactions, snapshots }（削除済みは含めない）

    const catById = new Map(data.categories.map((c) => [c.id, c]));
    const snapById = new Map(data.snapshots.map((s) => [s.id, s]));

    const push = (accId, ev) => {

        push(acc.settlementAccountId, { key, delta: -sign, kind: 'wd', tx: t, seq: 1e9 + i, card: acc.id });

      const p = perAcc.get(s.accountId);

    perAcc.forEach((p) => {
      p.events.sort((a, b) => a.key - b.key || a.seq - b.seq);
      let c = 0;

    model.diffs = new Map(); // snapId -> 差額情報

  /** key 以下の取引の増減合計（二分探索） */

   * チェックポイントごとの差額（設計書 4）
   * diff = 登録額 − 直前のチェックポイントからの計算額（調整取引込み）

    const p = model.perAcc.get(accId);
    if (!p) return [];
    return p.snaps.map((s, i) => {
      const adjs = model.adjBySnap.get(s.snap.id) || [];
      const adjSum = U.sum(adjs, (t) => t.amount);
      if (i === 0) return { snap: s.snap, key: s.key, first: true, expected: null, diff: 0, rawDiff: 0, adjSum, adjs };
      const prev = p.snaps[i - 1];
      const expected = prev.snap.amount + cumTo(p, s.key) - cumTo(p, prev.key);
      const diff = s.snap.amount - expected;
      return { snap: s.snap, key: s.key, first: false, expected, diff, rawDiff: diff + adjSum, adjSum, adjs };
    });
  };

  /**
   * 登録しようとしている残高の「計算残高」（入力中の差額表示用）
   * excludeSnapId を除いた上で、その時点の残高を求める
   */
  B.previewSnapshot = function (data, accId, date, timing, excludeSnapId) {

    const hasPrev = p && p.snaps.some((s) => s.key < qkey);

  C.defaultWithdrawDate = function (transactions, cardId, today, excludeTxId) {
    let last = null;
    transactions.forEach((t) => {
      if (t.accountId !== cardId || !t.withdrawDate || t.id === excludeTxId) return;
      if (t.type !== 'expense' && t.type !== 'income') return;
      if (!last || (t.createdAt || '') > (last.createdAt || '')) last = t;
    });
    if (last && last.withdrawDate >= today) return last.withdrawDate;
    return '';
  };

   * カード × 引き落とし日ごとの合計
   * 合計 = 支出の合計 − 収入（返品など）の合計

    const card = model.accById.get(cardId);
    if (!card || card.kind !== 'credit') return [];
    const auto = B.isAutoCard(card, model.accById);
    const map = new Map();
    model.data.transactions.forEach((t) => {
      if (t.accountId !== cardId || !t.withdrawDate) return;
      if (t.type !== 'expense' && t.type !== 'income') return;
      if (!map.has(t.withdrawDate))
        map.set(t.withdrawDate, { cardId, date: t.withdrawDate, total: 0, count: 0, items: [] });
      const g = map.get(t.withdrawDate);
      g.total += t.type === 'expense' ? t.amount : -t.amount;
      g.count++;
      g.items.push(t);
    });
    const bankId = card.settlementAccountId;
    const groups = [...map.values()].sort((a, b) => (a.date < b.date ? -1 : 1));
    groups.forEach((g) => {
      g.items.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
      g.auto = auto;
      if (!auto) { g.insufficient = false; return; }
      const bal = B.balanceAt(model, bankId, g.date, 'end');

<script>
/* 月次・年次集計（設計書「5. 月次集計」「7. 年次集計」） */
(function (KB) {
  'use strict';
  const U = KB.util;
  const B = KB.balance;
  const R = (KB.report = {});

  /**
   * 期間 [from, to] の集計
   * 期首残高 = from の朝時点、期末残高 = to の夜時点
   * 恒等式：期首 ＋ 収入 − 支出 ＋ 調整 ＋ 未調整の差額 ＝ 期末
   */
  R.period = function (model, from, to) {
    const k0 = B.queryKey(from, 'start');
    const k1 = B.queryKey(to, 'end');
    const inRange = (k) => k > k0 && k <= k1;
    let income = 0, expense = 0, adjust = 0, unadjusted = 0;
    const expByCat = new Map(), incByCat = new Map();

    model.data.transactions.forEach((t) => {
      if (t.type === 'income' || t.type === 'expense') {
        if (!inRange(B.txKey(t.date))) return;
        const map = t.type === 'income' ? incByCat : expByCat;
        map.set(t.categoryId, (map.get(t.categoryId) || 0) + t.amount);
        if (t.type === 'income') income += t.amount;
        else expense += t.amount;
      } else if (t.type === 'adjust') {
        const s = model.snapById.get(t.snapshotId);
        const key = s ? B.snapKey(s) - 1 : B.txKey(t.date);
        if (inRange(key)) adjust += t.amount;
      }
    });
    model.diffs.forEach((d) => {
      if (!d.first && inRange(d.key)) unadjusted += d.diff;
    });

    const accIds = [...model.perAcc.keys()];
    const open = B.totalAt(model, from, 'start', accIds);
    const close = B.totalAt(model, to, 'end', accIds);
    const byAccount = model.data.accounts.map((a) => ({
      account: a,
      open: B.balanceAt(model, a.id, from, 'start'),
      close: B.balanceAt(model, a.id, to, 'end'),
    }));
    return { from, to, income, expense, net: income - expense, adjust, unadjusted, open, close, byAccount, expByCat, incByCat };
  };

  R.month = (model, y, m) => R.period(model, U.monthStart(y, m), U.monthEnd(y, m));

  /** 年次：年間サマリー・月別推移・カテゴリ×月 */
  R.year = function (model, y) {
    const total = R.period(model, `${y}-01-01`, `${y}-12-31`);
    const months = [];
    for (let m = 1; m <= 12; m++) months.push(R.month(model, y, m));
    const catTable = (kind) => {
      const key = kind === 'expense' ? 'expByCat' : 'incByCat';
      const cats = model.data.categories.filter((c) => c.kind === kind);
      const ids = new Set(cats.map((c) => c.id));
      // 削除済みカテゴリ等の取引も落とさない
      months.forEach((mo) => mo[key].forEach((_, id) => ids.add(id)));
      return [...ids]
        .map((id) => {
          const cat = model.catById.get(id);
          const vals = months.map((mo) => mo[key].get(id) || 0);
          return { id, name: cat ? cat.name : '（未分類）', order: cat ? cat.order : 9999, vals, total: U.sum(vals) };
        })
        .filter((r) => r.total !== 0 || (model.catById.get(r.id) && !model.catById.get(r.id).archived))
        .sort((a, b) => a.order - b.order);
    };
    return { year: y, total, months, expenseRows: catTable('expense'), incomeRows: catTable('income') };
  };

<script>
/* 出納帳（設計書「8. 出納帳」） */
(function (KB) {
  'use strict';
  const U = KB.util;
  const B = KB.balance;
  const L = (KB.ledger = {});

  L.bookName = (kind) =>
    ({ cash: '現金出納帳', bank: '預金出納帳', emoney: '電子マネー出納帳', credit: 'カード利用帳' }[kind] || '出納帳');

  function txDesc(model, ev) {

    if (ev.kind === 'adjust') return '残高調整（使途不明）' + memo;
    if (t.type === 'transfer') {
      if (ev.dir === 'out') {
        const to = model.accById.get(t.toAccountId);
        return (to ? to.name : '（不明な口座）') + 'へ振替' + memo;
      }
      const from = model.accById.get(t.accountId);
      return (from ? from.name : '（不明な口座）') + 'から振替' + memo;
    }
    const cat = model.catById.get(t.categoryId);
    let s = (cat ? cat.name : '（未分類）') + memo;
    if (t.withdrawDate && B.isAutoCard(model.accById.get(t.accountId), model.accById))
      s += `（引落 ${U.md(t.withdrawDate)}）`;

   *   gap        … 残高差額（未調整）

    const k1 = B.queryKey(to, 'end');

      if (curMonth == null) return;

      rows.push({ type: 'cumTotal', ym: curMonth, in: cumIn, out: cumOut });

    const addEntry = (row) => {

      const delta = (row.in || 0) - (row.out || 0);
      if (running != null) running += delta;
      row.balance = running;

      cumIn += row.in || 0; cumOut += row.out || 0;

            running = s.snap.amount;

          } else lastEntry.mark = 'ok';
        } else if (d.diff !== 0) {

            in: d.diff > 0 ? d.diff : 0, out: d.diff < 0 ? -d.diff : 0, mark: 'diff', diff: d.diff,
          });

    for (let i = 0; i < evs.length; i++) {

        for (let j = i + 1; j < evs.length && evs[j].key === e.key; j++) {

        const date = e.tx.withdrawDate;

          const bank = model.accById.get(acc.settlementAccountId);

  // 全データ（削除印付きも含む）
  KB.state = { accounts: [], categories: [], transactions: [], snapshots: [], settings: {} };

  function req2p(r) {
    return new Promise((res, rej) => {
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }

  D.open = function () {
    return new Promise((resolve) => {
      let r;
      try {
        if (typeof indexedDB === 'undefined') throw new Error('IndexedDB がありません');
        r = indexedDB.open(DB_NAME, DB_VERSION);
      } catch (e) {
        D.error = e;
        return resolve(false);
      }
      r.onupgradeneeded = () => {
        const d = r.result;
        STORES.forEach((s) => {
          if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' });
        });
        if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', { keyPath: 'key' });
      };
      r.onsuccess = () => {
        db = r.result;
        D.persistent = true;
        resolve(true);
      };
      r.onerror = () => {
        D.error = r.error;
        resolve(false);
      };
      r.onblocked = () => {
        D.error = new Error('他のタブで古い版が開かれています');
        resolve(false);
      };
    });
  };

  D.loadAll = async function () {
    if (!db) return;
    const t = db.transaction(STORES.concat('settings'), 'readonly');
    for (const s of STORES) KB.state[s] = await req2p(t.objectStore(s).getAll());
    const settings = await req2p(t.objectStore('settings').getAll());
    KB.state.settings = {};
    settings.forEach((x) => (KB.state.settings[x.key] = x.value));
  };

  function writeMany(ops) {
    if (!db) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const names = [...new Set(ops.map((o) => o.store))];
      const t = db.transaction(names, 'readwrite');
      ops.forEach((o) => {
        if (o.clear) t.objectStore(o.store).clear();
        else t.objectStore(o.store).put(o.rec);
      });
      t.oncomplete = () => resolve();
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error || new Error('保存が中断されました'));
    });
  }

  /** 新規・更新（id・作成日時・更新日時を付ける）。recs は [store, rec] の配列 */
  D.saveMany = async function (pairs) {
    const now = U.now();
    const ops = pairs.map(([store, rec]) => {
      if (!rec.id) rec.id = U.uuid();
      if (!rec.createdAt) rec.createdAt = now;
      rec.updatedAt = now;
      return { store, rec };
    });
    await writeMany(ops);
    ops.forEach(({ store, rec }) => {
      const arr = KB.state[store];
      const i = arr.findIndex((x) => x.id === rec.id);
      if (i >= 0) arr[i] = rec;
      else arr.push(rec);
    });
    KB.invalidate();
  };
  D.save = (store, rec) => D.saveMany([[store, rec]]);

  /** 削除（同期に備えて実際には消さず、削除印を付ける） */
  D.removeMany = function (pairs) {
    return D.saveMany(pairs.map(([store, rec]) => [store, Object.assign({}, rec, { deleted: true })]));
  };
  D.remove = (store, rec) => D.removeMany([[store, rec]]);

  D.setSetting = async function (key, value) {
    KB.state.settings[key] = value;
    await writeMany([{ store: 'settings', rec: { key, value } }]);
  };

  /** 全データの置き換え（バックアップからの復元・全削除） */
  D.replaceAll = async function (data) {
    const ops = [];
    STORES.forEach((s) => {
      ops.push({ store: s, clear: true });
      (data[s] || []).forEach((rec) => ops.push({ store: s, rec }));
    });
    await writeMany(ops);
    STORES.forEach((s) => (KB.state[s] = (data[s] || []).slice()));
    KB.invalidate();
  };

  /** 削除印のないデータと計算モデル（変更があるまで使い回す） */
  let cache = null;
  KB.invalidate = () => (cache = null);
  KB.live = function () {
    if (cache) return cache;
    const alive = (r) => !r.deleted;
    const byOrder = (a, b) => (a.order || 0) - (b.order || 0) || ((a.createdAt || '') < (b.createdAt || '') ? -1 : 1);
    const data = {
      accounts: KB.state.accounts.filter(alive).sort(byOrder),
      categories: KB.state.categories.filter(alive).sort(byOrder),
      transactions: KB.state.transactions.filter(alive),
      snapshots: KB.state.snapshots.filter(alive),
    };
    cache = { data, model: KB.balance.buildModel(data) };
    return cache;
  };
})(typeof window !== 'undefined' ? (window.KB = window.KB || {}) : (globalThis.KB = globalThis.KB || {}));

</script>
<script>
/* バックアップ（JSON）・CSV出力・初期データ */
(function (KB) {
  'use strict';
  const U = KB.util;
  const IO = (KB.io = {});
  const VERSION = 1;

  IO.DEFAULT_CATEGORIES = [
    ['食費', 'expense', '#e5534b'], ['日用品', 'expense', '#d4a72c'], ['交通費', 'expense', '#3e8ed0'],
    ['住居費', 'expense', '#8256d0'], ['光熱費', 'expense', '#e0823d'], ['通信費', 'expense', '#2da44e'],
    ['娯楽', 'expense', '#bf3989'], ['その他', 'expense', '#8c959f'],
    ['給与', 'income', '#1a7f37'], ['その他', 'income', '#6e7781'],
  ];

  IO.defaultCategories = () =>
    IO.DEFAULT_CATEGORIES.map(([name, kind, color], i) => ({ id: U.uuid(), name, kind, color, order: i + 1 }));

  IO.exportJSON = function () {
    const s = KB.state;
    return JSON.stringify(
      {
        app: 'kakeibo', version: VERSION, exportedAt: U.now(),
        accounts: s.accounts, categories: s.categories, transactions: s.transactions, snapshots: s.snapshots,
      },
      null, 1
    );
  };

  /** 復元前の検査。問題があれば error を返す */
  IO.parseBackup = function (text) {
    let d;
    try {
      d = JSON.parse(text);
    } catch (e) {
      return { error: 'JSONファイルとして読めません' };
    }
    if (!d || d.app !== 'kakeibo') return { error: 'この家計簿のバックアップファイルではありません' };
    if (typeof d.version !== 'number' || d.version > VERSION)
      return { error: `対応していない版のファイルです（版 ${d.version}）。アプリを最新にしてください` };
    for (const k of ['accounts', 'categories', 'transactions', 'snapshots'])
      if (!Array.isArray(d[k])) return { error: `ファイルの中身が足りません（${k}）` };
    const bad = [].concat(d.accounts, d.categories, d.transactions, d.snapshots).find((r) => !r || typeof r.id !== 'string');
    if (bad) return { error: 'ファイルの中に壊れたデータがあります' };
    const alive = (a) => a.filter((r) => !r.deleted).length;
    return { data: d, summary: { accounts: alive(d.accounts), transactions: alive(d.transactions), snapshots: alive(d.snapshots), exportedAt: d.exportedAt } };
  };

  const TYPE = { income: '収入', expense: '支出', transfer: '振替', adjust: '調整' };

  /** 全取引のCSV */
  IO.transactionsCSV = function () {
    const { data, model } = KB.live();
    const name = (id, map) => (map.get(id) ? map.get(id).name : '');
    const rows = [['日付', '種類', '金額', '口座', '振替先', 'カテゴリ', '引き落とし日', 'メモ']];
    data.transactions
      .slice()
      .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.createdAt || '') < (b.createdAt || '') ? -1 : 1))
      .forEach((t) =>
        rows.push([
          t.date, TYPE[t.type] || t.type, t.amount, name(t.accountId, model.accById), name(t.toAccountId, model.accById),
          name(t.categoryId, model.catById), t.withdrawDate || '', t.memo || '',
        ])
      );
    return U.csv(rows);
  };

  IO.TYPE = TYPE;
})(typeof window !== 'undefined' ? (window.KB = window.KB || {}) : (globalThis.KB = globalThis.KB || {}));

<script>
/* 画面切替・共通部品 */
(function (KB) {
  'use strict';
  const U = KB.util;
  const UI = (KB.ui = { views: {} });

  UI.NAV = [
    ['', 'ホーム'], ['list', '取引一覧'], ['balance', '残高'], ['withdraw', '引き落とし'],
    ['report', '月次'], ['annual', '年次'], ['ledger', '出納帳'], ['config', '設定'],
  ];
  UI.KIND = { cash: '現金', bank: '銀行', emoney: '電子マネー', credit: 'クレジットカード', other: 'その他' };

  /* ---------- ルーティング（URL の # で切替） ---------- */
  // 形式：#home / #list / #report-2026-11 / #annual-2026（英数字とハイフンのみ）
  UI.parseHash = function () {
    const h = location.hash.replace(/^#\/?/, '');
    const parts = h.split('-');
    const path = parts[0] === 'home' ? '' : parts[0];
    return { path, params: { y: parts[1], m: parts[2] } };
  };
  UI.go = (path) => {
    const h = '#' + (path || 'home');
    if (location.hash === h) UI.render();
    else location.hash = h;
  };

  UI.render = function () {
    const root = document.getElementById('app');
    const { data } = KB.live();
    const nav = document.getElementById('nav');
    const fab = document.getElementById('fab');
    if (data.accounts.length === 0) {
      nav.innerHTML = '';
      fab.hidden = true;
      UI.views.setup(root);
      return;
    }
    fab.hidden = false;
    const { path, params } = UI.parseHash();
    const view = UI.views[path || 'home'] || UI.views.home;
    nav.innerHTML = UI.NAV.map(
      ([p, label]) => `<a href="#${p || 'home'}" class="${p === path || (!UI.views[path] && p === '') ? 'active' : ''}">${label}</a>`
    ).join('');
    const active = nav.querySelector('.active');
    if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    try {
      view(root, params);
    } catch (e) {
      console.error(e);
      root.innerHTML = `<div class="card error">画面の表示中にエラーが起きました：${U.esc(e.message)}</div>`;
    }
  };

  /* ---------- ダイアログ ---------- */
  function makeDialog(id) {
    let d = document.getElementById(id);
    if (!d) {
      d = document.createElement('dialog');
      d.id = id;
      document.body.appendChild(d);
    }
    return d;
  }

  /** opts: { title, body(html), wide, onMount(el, close) } */
  UI.openDialog = function (opts) {
    const d = makeDialog('dlg');
    d.className = opts.wide ? 'wide' : '';
    d.innerHTML = `<form method="dialog" class="dlg" novalidate>
      <div class="dlg-head"><h2>${U.esc(opts.title)}</h2><button type="button" class="icon-btn" data-close aria-label="閉じる">×</button></div>
      <div class="dlg-body">${opts.body}</div></form>`;
    const close = () => {
      if (d.open) d.close();
    };
    d.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', close));
    d.onclick = (e) => {
      if (e.target === d) close();
    };
    if (!d.open) d.showModal();
    UI.bindNumInputs(d);
    if (opts.onMount) opts.onMount(d, close);
    return { el: d, close };
  };

  /** 確認ダイアログ（入力ダイアログの上に重ねられる） → Promise<boolean> */
  UI.confirm = function (message, opts) {
    opts = opts || {};
    return new Promise((resolve) => {
      const d = makeDialog('dlg-confirm');
      d.className = 'confirm';
      d.innerHTML = `<div class="dlg"><div class="dlg-body"><p class="confirm-msg">${U.esc(message).replace(/\n/g, '<br>')}</p>
        <div class="actions"><button type="button" class="btn" data-no>${U.esc(opts.cancelLabel || 'キャンセル')}</button>
        <button type="button" class="btn ${opts.danger ? 'danger' : 'primary'}" data-yes>${U.esc(opts.okLabel || 'OK')}</button></div></div></div>`;
      const done = (v) => {
        d.close();
        resolve(v);
      };
      d.querySelector('[data-yes]').onclick = () => done(true);
      d.querySelector('[data-no]').onclick = () => done(false);
      d.oncancel = (e) => {
        e.preventDefault();
        done(false);
      };
      d.showModal();
      d.querySelector('[data-yes]').focus();
    });
  };

  /**
   * 数字欄（data-num）：全角で打たれた数字をその場で半角に直す。
   * 日本語入力の変換中は触らず、確定した時点で直す。
   * 「＋/−」ボタン（data-sign）で符号を切り替える（スマホの数字キーボードにマイナスがないため）
   */
  UI.bindNumInputs = function (root) {
    const fix = (el) => {
      const v = U.toHalfNum(el.value);
      if (v === el.value) return;
      const pos = el.selectionStart;
      const diff = el.value.length - v.length;
      el.value = v;
      try {
        if (pos != null) el.setSelectionRange(pos - diff, pos - diff);
      } catch (e) { /* 一部の欄では位置を戻せない */ }
      el.dispatchEvent(new Event('input', { bubbles: true }));
    };
    root.querySelectorAll('input[data-num]').forEach((el) => {
      if (el._numBound) return;
      el._numBound = true;
      el.addEventListener('input', (e) => { if (!e.isComposing) fix(el); });
      el.addEventListener('compositionend', () => setTimeout(() => fix(el), 0));
      el.addEventListener('blur', () => fix(el));
    });
    root.querySelectorAll('[data-sign]').forEach((b) => {
      if (b._signBound) return;
      b._signBound = true;
      b.addEventListener('click', () => {
        const el = b.closest('.amount-row').querySelector('input');
        const v = U.toHalfNum(el.value).trim();
        el.value = v.startsWith('-') ? v.slice(1) : '-' + v;
        el.dispatchEvent(new Event('input', { bubbles: true }));
        el.focus();
      });
    });
  };

  UI.toast = function (msg, kind) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show ' + (kind || '');
    clearTimeout(UI._toastTimer);
    UI._toastTimer = setTimeout(() => (t.className = ''), 2600);
  };

  /** 保存処理を包み、失敗時はメッセージを出す */
  UI.guard = async function (fn) {
    try {
      await fn();
      return true;
    } catch (e) {
      console.error(e);
      UI.toast('保存に失敗しました。バックアップを取ってください（' + (e && e.message ? e.message : e) + '）', 'error');
      return false;
    }
  };

  /* ---------- 表示用の小物 ---------- */
  UI.balanceHTML = function (b, opts) {
    if (!b || b.status === 'unknown') return '<span class="muted">不明</span>';
    const tag = b.status === 'estimated' ? ' <span class="tag est" title="後の残高登録から逆算した推定値">推定</span>' : '';
    return `<span class="amt ${b.value < 0 ? 'neg' : ''}">${U.yen(b.value)}</span>${opts && opts.noTag ? '' : tag}`;
  };
  UI.signed = (v, kind) => {
    if (kind === 'income') return `<span class="amt inc">+${U.num(v)}</span>`;
    if (kind === 'expense') return `<span class="amt exp">−${U.num(v)}</span>`;
    return `<span class="amt">${U.num(v)}</span>`;
  };
  UI.accountOptions = (accounts, selected, opts) =>
    (opts && opts.empty ? `<option value="">${U.esc(opts.empty)}</option>` : '') +
    accounts.map((a) => `<option value="${a.id}" ${a.id === selected ? 'selected' : ''}>${U.esc(a.name)}${a.archived ? '（非表示）' : ''}</option>`).join('');
  UI.categoryOptions = (cats, selected) =>
    cats.map((c) => `<option value="${c.id}" ${c.id === selected ? 'selected' : ''}>${U.esc(c.name)}${c.archived ? '（非表示）' : ''}</option>`).join('');

  UI.fieldError = function (root, name, msg) {
    const el = root.querySelector(`[data-err="${name}"]`);
    if (el) {
      el.textContent = msg || '';
      el.hidden = !msg;
    }
  };

  /** 一覧テーブルのCSV/印刷ボタン */
  UI.toolButtons = (id) =>
    `<div class="tools no-print"><button type="button" class="btn small" data-print="${id}" title="${U.inViewer() ? '印刷用のファイルを保存します。開くと印刷画面になります' : '印刷またはPDFに保存'}">${U.inViewer() ? '印刷用に保存' : '印刷・PDF'}</button>
     <button type="button" class="btn small" data-csv="${id}">CSV</button></div>`;

  UI.bindTools = function (root, handlers) {
    root.querySelectorAll('[data-print]').forEach((b) => (b.onclick = () => UI.print(b.dataset.print)));
    root.querySelectorAll('[data-csv]').forEach((b) => (b.onclick = () => handlers[b.dataset.csv] && handlers[b.dataset.csv]()));
  };

  const PRINT_CSS = `body{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;color:#000;font-size:10pt;margin:0;font-feature-settings:"tnum" 1}
    table{border-collapse:collapse;width:100%}th,td{padding:3px 5px;border-bottom:.5pt solid #999;text-align:left;vertical-align:top}
    thead th{border-bottom:1pt solid #333;font-size:9pt}.r{text-align:right}.nowrap{white-space:nowrap}
    .card-head,.tools,.no-print,.hint,.icon-btn{display:none!important}.print-only{display:block!important}
    h1{font-size:14pt;margin:0 0 3mm}h3{font-size:11pt;margin:5mm 0 2mm}p{margin:0 0 3mm}
    .tag{font-size:7.5pt;border:.5pt solid #777;border-radius:3px;padding:0 3px;margin-left:3px}.sub{font-size:8pt;color:#555}
    .muted{color:#555}.neg{color:#b42318}.mark{font-size:7.5pt;font-weight:700}.total td,.total th,tr.carry td,tr.subtotal td{font-weight:700}
    tr.cumtotal td{color:#555;font-size:8.5pt}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
    .bar{display:block;height:8px;border-radius:4px}.dot,.bar{print-color-adjust:exact;-webkit-print-color-adjust:exact}
    a{color:inherit;text-decoration:none}thead{display:table-header-group}tr{page-break-inside:avoid}`;

  /** 印刷用の単独HTMLを作って保存する（claude.ai の中では印刷が使えないため） */
  UI.savePrintFile = async function (el) {
    const clone = el.cloneNode(true);
    clone.querySelectorAll('.tools,.no-print').forEach((x) => x.remove());
    const h = clone.querySelector('.print-only h1, h1.print-only');
    const title = (h ? h.textContent : document.title).trim();
    const wide = el.classList.contains('print-wide');
    const html = `<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><title>${U.esc(title)}</title>
      <style>@page{size:A4 ${wide ? 'landscape' : 'portrait'};margin:12mm}${PRINT_CSS}</style></head>
      <body>${clone.innerHTML}<script>window.addEventListener('load',function(){setTimeout(function(){window.print()},300)})<\/script></body></html>`;
    const r = await U.download(`${title.replace(/[\\/:*?"<>|]/g, '_')}.html`, html, 'text/html');
    if (r === 'saved') UI.toast('印刷用のファイルを保存しました。開くと印刷画面になります（PDF保存も可）');
  };

  /** 指定した部分だけを印刷する（その他は印刷時に隠す） */
  UI.print = function (sectionId) {
    if (U.inViewer()) {
      const el = document.getElementById(sectionId);
      if (el) UI.savePrintFile(el);
      return;
    }
    document.body.classList.add('printing-section');
    document.querySelectorAll('.print-target').forEach((e) => e.classList.remove('print-target'));
    const el = sectionId ? document.getElementById(sectionId) : null;
    if (el) el.classList.add('print-target');
    else document.body.classList.remove('printing-section');
    setTimeout(() => {
      window.print();
      setTimeout(() => {
        document.body.classList.remove('printing-section');
        if (el) el.classList.remove('print-target');
      }, 500);
    }, 50);
  };

  UI.monthNav = (y, m) => {
    let py = y, pm = m - 1, ny = y, nm = m + 1;
    if (pm < 1) { pm = 12; py--; }
    if (nm > 12) { nm = 1; ny++; }
    return { prev: [py, pm], next: [ny, nm] };
  };

  UI.thisYM = () => {
    const t = U.todayStr();
    return [+t.slice(0, 4), +t.slice(5, 7)];
  };
})(window.KB = window.KB || {});

</script>
<script>

(function (KB) {

  const U = KB.util, UI = KB.ui, B = KB.balance, C = KB.credit, D = KB.db;
