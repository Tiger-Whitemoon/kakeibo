      <label class="field"><span data-label="account">口座</span><select name="accountId">${UI.accountOptions(activeAccs, t.accountId)}</select>
        <small class="err" data-err="accountId" hidden></small></label>
      <label class="field" data-show="transfer"><span>振替先</span><select name="toAccountId">${UI.accountOptions(activeAccs, t.toAccountId, { empty: '選んでください' })}</select>
        <small class="err" data-err="toAccountId" hidden></small><small class="warn" data-warn="toAccountId" hidden></small></label>
      <label class="field" data-show="cat"><span>カテゴリ</span><select name="categoryId"></select>
        <small class="err" data-err="categoryId" hidden></small></label>
      <label class="field" data-show="wd"><span>引き落とし日</span><input type="date" name="withdrawDate" value="${t.withdrawDate || ''}">
        <small class="hint">初期値は同じカードの直前の引き落とし日です。変えるときはカレンダーから選んでください。まだ分からない場合は空欄のまま保存し、後日入力できます。</small>
        <small class="warn" data-warn="wd-bank" hidden>このカードは引き落とし口座が未設定です。「設定」で引き落とし口座を選ぶと、引き落とし日に銀行の残高から自動で引かれます。</small>
        <small class="err" data-err="withdrawDate" hidden></small></label>
      <label class="field"><span>メモ</span><input type="text" name="memo" value="${U.esc(t.memo || '')}" maxlength="200"></label>
      <div class="actions">
        ${isEdit ? '<button type="button" class="btn danger-ghost" data-act="delete">削除</button><span class="spacer"></span>' : ''}
        <button type="button" class="btn" data-close>キャンセル</button>
        ${isEdit ? '' : '<button type="button" class="btn" data-act="again">保存して続けて入力</button>'}
        <button type="submit" class="btn primary" data-act="save">保存</button>
      </div>`;

    UI.openDialog({
      title: isEdit ? '取引の編集' : '取引の入力',
      body,
      onMount(el, close) {
        const f = el.querySelector('form');
        const $ = (n) => f.elements[n];
        let wdTouched = !!(isEdit && t.withdrawDate);

        const type = () => f.querySelector('input[name=type]:checked').value;
        const curAcc = () => model.accById.get($('accountId').value);
        const isCard = () => !!(curAcc() && curAcc().kind === 'credit');
        const isAutoCard = () => B.isAutoCard(curAcc(), model.accById);
        const fillCats = () => {
          const k = type();
          if (k === 'transfer') return;
          const cur = $('categoryId').value || (t.type === k ? t.categoryId : memory.cat[k]);
          const cats = data.categories.filter((c) => c.kind === k && (!c.archived || c.id === cur));
          $('categoryId').innerHTML = UI.categoryOptions(cats, cats.some((c) => c.id === cur) ? cur : cats[0] && cats[0].id);
        };
        const setDefaultWd = () => {
          if (wdTouched) return;
          $('withdrawDate').value = C.defaultWithdrawDate(data.transactions, $('accountId').value, U.todayStr(), existing && existing.id);
        };
        const refresh = () => {
          const k = type();
          f.querySelector('[data-show=transfer]').hidden = k !== 'transfer';
          f.querySelector('[data-show=cat]').hidden = k === 'transfer';
          f.querySelector('[data-label=account]').textContent = k === 'transfer' ? '出金元' : '口座';
          const showWd = k !== 'transfer' && isCard();
          f.querySelector('[data-show=wd]').hidden = !showWd;
          f.querySelector('[data-warn=wd-bank]').hidden = !(showWd && !isAutoCard());
          if (showWd) setDefaultWd();
          $('withdrawDate').min = $('date').value || '';
          const fut = $('date').value && $('date').value > U.todayStr();
          const w = f.querySelector('[data-warn=date]');
          w.hidden = !fut;
          w.textContent = fut ? '未来の日付です（このまま保存できます）' : '';
          const to = model.accById.get($('toAccountId').value);
          const tw = f.querySelector('[data-warn=toAccountId]');
          const twShow = k === 'transfer' && B.isAutoCard(to, model.accById);
          tw.hidden = !twShow;
          tw.textContent = twShow ? 'このカードは引き落とし日に自動で銀行から引かれます。振替を入れると二重になります。' : '';
          fillCats();
        };
        if (!t.accountId) {
          const remembered = memory.acc[t.type];
          if (remembered && activeAccs.some((a) => a.id === remembered)) $('accountId').value = remembered;
        }
        f.querySelectorAll('input[name=type]').forEach((r) => r.addEventListener('change', () => { $('categoryId').value = ''; refresh(); }));
        $('accountId').addEventListener('change', () => { wdTouched = false; refresh(); });
        $('toAccountId').addEventListener('change', refresh);
        $('date').addEventListener('change', refresh);
        $('withdrawDate').addEventListener('change', () => (wdTouched = true));
        refresh();
        if (!isEdit) setTimeout(() => $('amount').focus(), 50);

        const collect = () => {
          ['date', 'amount', 'accountId', 'toAccountId', 'categoryId', 'withdrawDate'].forEach((n) => UI.fieldError(f, n, ''));
          let ok = true;
          const err = (n, m) => { UI.fieldError(f, n, m); ok = false; };
          const k = type();
          const rec = isEdit ? JSON.parse(JSON.stringify(existing)) : {};
          rec.type = k;
          rec.date = $('date').value;
          if (!U.isValidDate(rec.date)) err('date', '日付を入力してください');
          const a = U.parseAmount($('amount').value);
          if (a.error) err('amount', a.error);
          else rec.amount = a.value;
          rec.accountId = $('accountId').value;
          if (!rec.accountId) err('accountId', '口座を選んでください');
          rec.memo = U.cleanText($('memo').value);
          delete rec.toAccountId; delete rec.categoryId; delete rec.withdrawDate;
          if (k === 'transfer') {
            rec.toAccountId = $('toAccountId').value;
            if (!rec.toAccountId) err('toAccountId', '振替先を選んでください');
            else if (rec.toAccountId === rec.accountId) err('toAccountId', '出金元と振替先が同じです');
          } else {
            rec.categoryId = $('categoryId').value;
            if (!rec.categoryId) err('categoryId', 'カテゴリを選んでください');
            // カードの引き落とし日は任意（空欄なら「未設定」として後日入力）
            const wd = isCard() ? $('withdrawDate').value : '';
            if (wd) {
              rec.withdrawDate = wd;
              if (!U.isValidDate(wd)) err('withdrawDate', '日付が正しくありません');
              else if (rec.date && wd < rec.date) err('withdrawDate', '引き落とし日は利用日以降の日付にしてください');
            }
          }
          return ok ? rec : null;
        };

        const save = async (again) => {
          const rec = collect();
          if (!rec) return;
          if (rec.type === 'transfer' && B.isAutoCard(model.accById.get(rec.toAccountId), model.accById)) {
            const yes = await UI.confirm('このカードは引き落とし日に自動で銀行から引かれます。\n振替も入れると二重に引かれた計算になります。保存しますか？', { okLabel: '保存する' });
            if (!yes) return;
          }
          const ok = await UI.guard(() => D.save('transactions', rec));
          if (!ok) return;
          memory.type = rec.type;
          memory.date = rec.date;
          memory.acc[rec.type] = rec.accountId;
          if (rec.categoryId) memory.cat[rec.type] = rec.categoryId;
          UI.render();
          if (again) {
            UI.toast('保存しました。続けて入力できます');
            const keep = { type: rec.type, date: rec.date, accountId: rec.accountId, categoryId: rec.categoryId, toAccountId: rec.toAccountId };
            A.openTx(null, keep);
          } else {
            close();
            UI.toast(isEdit ? '変更を保存しました' : '保存しました');
          }
        };
        f.addEventListener('submit', (e) => { e.preventDefault(); save(false); });
        const again = f.querySelector('[data-act=again]');
        if (again) again.onclick = () => save(true);
        const del = f.querySelector('[data-act=delete]');
        if (del)
          del.onclick = async () => {
            if (!(await UI.confirm('この取引を削除しますか？', { okLabel: '削除', danger: true }))) return;
            if (await UI.guard(() => D.remove('transactions', existing))) {
              close();
              UI.render();
              UI.toast('削除しました');
            }
          };
      },
    });
  };

  /* ================= 残高の登録 ================= */
  A.openSnapshot = function (existing, preset) {
    const { data, model } = KB.live();
    const isEdit = !!existing;
    const s = Object.assign({ date: U.todayStr(), timing: 'end', amount: '', memo: '' }, preset || {}, existing || {});
    const accs = data.accounts.filter((a) => !a.archived || a.id === s.accountId);
    const hadAdjust = isEdit && (model.adjBySnap.get(existing.id) || []).length > 0;

    const body = `
      <p class="hint">財布や通帳を見て、<b>その時点で実際にいくらあったか</b>を登録します。月の途中からでも、何回でも登録できます。</p>
      <label class="field"><span>口座</span><select name="accountId">${UI.accountOptions(accs, s.accountId)}</select></label>
      <div class="grid2">
        <label class="field"><span>日付</span><input type="date" name="date" value="${s.date}"><small class="err" data-err="date" hidden></small></label>
        <div class="field"><span>いつ時点</span>
          <div class="seg small">
            <label><input type="radio" name="timing" value="start" ${s.timing === 'start' ? 'checked' : ''}><span>朝（その日の取引前）</span></label>
            <label><input type="radio" name="timing" value="end" ${s.timing !== 'start' ? 'checked' : ''}><span>夜（その日の取引後）</span></label>
          </div></div>
      </div>
      <label class="field"><span>残高（円）</span><span class="amount-row"><input type="tel" name="amount" inputmode="numeric" data-num autocomplete="off" value="${s.amount}" placeholder="例 30000"><button type="button" class="btn sign-btn" data-sign="amount" title="プラス・マイナスを切り替え">＋/−</button></span>
        <small class="err" data-err="amount" hidden></small></label>
      <div class="preview" data-preview></div>
      <label class="check" data-adjust hidden><input type="checkbox" name="adjust" ${hadAdjust ? 'checked' : ''}> 差額を「調整（使途不明）」として記録する</label>
      <label class="field"><span>メモ</span><input type="text" name="memo" value="${U.esc(s.memo || '')}" maxlength="200"></label>
      <div class="actions">
        ${isEdit ? '<button type="button" class="btn danger-ghost" data-act="delete">削除</button><span class="spacer"></span>' : ''}
        <button type="button" class="btn" data-close>キャンセル</button>
        <button type="submit" class="btn primary">保存</button>
      </div>`;

    UI.openDialog({
      title: isEdit ? '残高の編集' : '残高の登録',
      body,
      onMount(el, close) {
        const f = el.querySelector('form');
        const $ = (n) => f.elements[n];
        const timing = () => f.querySelector('input[name=timing]:checked').value;
        const pv = f.querySelector('[data-preview]');
        const adjBox = f.querySelector('[data-adjust]');
        const update = () => {
          const date = $('date').value;
          if (!U.isValidDate(date) || !$('accountId').value) { pv.innerHTML = ''; adjBox.hidden = true; return; }
          const r = B.previewSnapshot(data, $('accountId').value, date, timing(), isEdit ? existing.id : null);
          const a = U.parseAmount($('amount').value, { allowNegative: true });
          if (r.expected == null) {
            pv.innerHTML = '<span class="muted">これより前に登録した残高がないため、ここが計算の起点になります。</span>';
            adjBox.hidden = true;
            return;
          }
          let html = `この時点の帳簿上の残高：<b>${U.yen(r.expected)}</b>`;
          if (!a.error) {
            const diff = a.value - r.expected;
            html += diff === 0
              ? '<br><span class="ok-text">帳簿と一致しています</span>'
              : `<br>差額：<b class="${diff < 0 ? 'neg' : ''}">${diff > 0 ? '+' : ''}${U.yen(diff)}</b> <span class="muted">（記入漏れの可能性があります）</span>`;
            adjBox.hidden = diff === 0;
          } else adjBox.hidden = true;
          pv.innerHTML = html;
        };
        ['accountId', 'date', 'amount'].forEach((n) => $(n).addEventListener('input', update));
        f.querySelectorAll('input[name=timing]').forEach((r) => r.addEventListener('change', update));
        update();
        if (!isEdit) setTimeout(() => $('amount').focus(), 50);

        f.addEventListener('submit', async (e) => {
          e.preventDefault();
          UI.fieldError(f, 'date', ''); UI.fieldError(f, 'amount', '');
          const date = $('date').value;
          const a = U.parseAmount($('amount').value, { allowNegative: true });
          if (!U.isValidDate(date)) return UI.fieldError(f, 'date', '日付を入力してください');
          if (a.error) return UI.fieldError(f, 'amount', a.error);
          const rec = isEdit ? Object.assign({}, existing) : {};
          Object.assign(rec, { accountId: $('accountId').value, date, timing: timing(), amount: a.value, memo: U.cleanText($('memo').value) });
          const pairs = [];
          // 同じ口座・日付・時点のチェックポイントがあれば上書き確認
          const dup = KB.live().data.snapshots.find((x) => x.accountId === rec.accountId && x.date === rec.date && x.timing === rec.timing && x.id !== rec.id);
          if (dup) {
            const yes = await UI.confirm(`${U.ymd(date)}（${rec.timing === 'start' ? '朝' : '夜'}）の残高は登録済み（${U.yen(dup.amount)}）です。上書きしますか？`, { okLabel: '上書き' });
            if (!yes) return;
            if (isEdit) {
              pairs.push(['snapshots', Object.assign({}, existing, { deleted: true })]);
              (model.adjBySnap.get(existing.id) || []).forEach((t) => pairs.push(['transactions', Object.assign({}, t, { deleted: true })]));
            }
            rec.id = dup.id;
            rec.createdAt = dup.createdAt;
          }
          pairs.push(['snapshots', rec]);
          const ok = await UI.guard(async () => {
            await D.saveMany(pairs);
            await A.setAdjust(rec.id, $('adjust').checked && !adjBox.hidden);
          });
          if (ok) {
            close();
            UI.render();
            UI.toast('残高を登録しました');
          }
        });
        const del = f.querySelector('[data-act=delete]');
        if (del)
          del.onclick = async () => {
            if (!(await UI.confirm('この残高の登録を削除しますか？\n（この登録に付けた調整も削除します）', { okLabel: '削除', danger: true }))) return;
            const pairs = [['snapshots', existing]].concat((model.adjBySnap.get(existing.id) || []).map((t) => ['transactions', t]));
            if (await UI.guard(() => D.removeMany(pairs))) {
              close();
              UI.render();
              UI.toast('削除しました');
            }
          };
      },
    });
  };

  /** チェックポイントの調整取引を、現在の差額どおりに作り直す（on=false なら消す） */
  A.setAdjust = async function (snapId, on) {
    const { model } = KB.live();
    const d = model.diffs.get(snapId);
    const adjs = (model.adjBySnap.get(snapId) || []).slice();
    const pairs = [];
    if (on && d && !d.first && d.rawDiff !== 0) {
      const keep = adjs.shift() || { type: 'adjust', snapshotId: snapId, accountId: d.snap.accountId, memo: '' };
      pairs.push(['transactions', Object.assign({}, keep, { amount: d.rawDiff, date: d.snap.date, accountId: d.snap.accountId })]);
    }
    adjs.forEach((t) => pairs.push(['transactions', Object.assign({}, t, { deleted: true })]));
    if (pairs.length) await D.saveMany(pairs);
  };

  /* ================= 口座 ================= */
  A.openAccount = function (existing) {
    const { data, model } = KB.live();
    const isEdit = !!existing;
    const a = Object.assign({ name: '', kind: 'cash', settlementAccountId: '' }, existing || {});
    const banks = data.accounts.filter((x) => x.kind !== 'credit' && x.id !== a.id && (!x.archived || x.id === a.settlementAccountId));
    const used = isEdit && (data.transactions.some((t) => t.accountId === a.id || t.toAccountId === a.id) ||
      data.snapshots.some((s) => s.accountId === a.id) || data.accounts.some((x) => x.settlementAccountId === a.id));
    const body = `
      <label class="field"><span>口座名</span><input type="text" name="name" value="${U.esc(a.name)}" maxlength="40" placeholder="例 財布、○○銀行、○○カード">
        <small class="err" data-err="name" hidden></small></label>
      <label class="field"><span>種類</span><select name="kind">${Object.entries(UI.KIND).map(([k, l]) => `<option value="${k}" ${a.kind === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <label class="field" data-show="credit"><span>引き落とし口座</span>
        <select name="settlementAccountId">${UI.accountOptions(banks, a.settlementAccountId, { empty: '設定しない（引き落としを自動計算しない）' })}</select>
        <small class="hint">設定すると、カードの利用分が引き落とし日にこの口座から自動で引かれます。</small></label>
      ${isEdit ? `<label class="check"><input type="checkbox" name="archived" ${a.archived ? 'checked' : ''}> 使わない口座として非表示にする（過去のデータは残ります）</label>` : ''}
      <div class="actions">
        ${isEdit && !used ? '<button type="button" class="btn danger-ghost" data-act="delete">削除</button><span class="spacer"></span>' : ''}
        <button type="button" class="btn" data-close>キャンセル</button>
        <button type="submit" class="btn primary">保存</button>
      </div>
      ${isEdit && used ? '<p class="hint">取引や残高の登録がある口座は削除できません。使わない場合は非表示にしてください。</p>' : ''}`;
    UI.openDialog({
      title: isEdit ? '口座の編集' : '口座の追加',
      body,
      onMount(el, close) {
        const f = el.querySelector('form');
        const $ = (n) => f.elements[n];
        const refresh = () => (f.querySelector('[data-show=credit]').hidden = $('kind').value !== 'credit');
        $('kind').addEventListener('change', refresh);
        refresh();
        f.addEventListener('submit', async (e) => {
          e.preventDefault();
          const name = U.cleanText($('name').value);
          if (!name) return UI.fieldError(f, 'name', '口座名を入力してください');
          const rec = Object.assign({}, existing || { order: data.accounts.length + 1 }, { name, kind: $('kind').value });
          rec.settlementAccountId = rec.kind === 'credit' ? $('settlementAccountId').value || '' : '';
          if (isEdit) rec.archived = $('archived').checked;
          if (await UI.guard(() => D.save('accounts', rec))) {
            close();
            UI.render();
            if (!isEdit) {
              const yes = await UI.confirm(`「${name}」の残高を登録しますか？\n（登録すると、その日からの残高が計算されます）`, { okLabel: '残高を登録', cancelLabel: 'あとで' });
              if (yes) A.openSnapshot(null, { accountId: rec.id });
            } else UI.toast('保存しました');
          }
        });
        const del = f.querySelector('[data-act=delete]');
        if (del)
          del.onclick = async () => {
            if (!(await UI.confirm(`口座「${a.name}」を削除しますか？`, { okLabel: '削除', danger: true }))) return;
            if (await UI.guard(() => D.remove('accounts', existing))) { close(); UI.render(); }
          };
      },
    });
  };

  /* ================= カテゴリ ================= */
  A.openCategory = function (existing, kind) {
    const { data } = KB.live();
    const isEdit = !!existing;
    const c = Object.assign({ name: '', kind: kind || 'expense', color: '#8c959f' }, existing || {});
    const used = isEdit && data.transactions.some((t) => t.categoryId === c.id);
    const body = `
      <label class="field"><span>カテゴリ名</span><input type="text" name="name" value="${U.esc(c.name)}" maxlength="30">
        <small class="err" data-err="name" hidden></small></label>
      <div class="grid2">
        <label class="field"><span>種類</span><select name="kind" ${isEdit ? 'disabled' : ''}>
          <option value="expense" ${c.kind === 'expense' ? 'selected' : ''}>支出</option><option value="income" ${c.kind === 'income' ? 'selected' : ''}>収入</option></select></label>
        <label class="field"><span>色</span><input type="color" name="color" value="${c.color || '#8c959f'}"></label>
      </div>
      ${isEdit ? `<label class="check"><input type="checkbox" name="archived" ${c.archived ? 'checked' : ''}> 入力の選択肢から外す（過去の取引には残ります）</label>` : ''}
      <div class="actions">
        ${isEdit && !used ? '<button type="button" class="btn danger-ghost" data-act="delete">削除</button><span class="spacer"></span>' : ''}
        <button type="button" class="btn" data-close>キャンセル</button>
        <button type="submit" class="btn primary">保存</button>
      </div>
      ${isEdit && used ? '<p class="hint">取引で使われているカテゴリは削除できません。不要なら選択肢から外してください。</p>' : ''}`;
    UI.openDialog({
      title: isEdit ? 'カテゴリの編集' : 'カテゴリの追加',
      body,
      onMount(el, close) {
        const f = el.querySelector('form');
        const $ = (n) => f.elements[n];
        f.addEventListener('submit', async (e) => {
          e.preventDefault();
          const name = U.cleanText($('name').value);
          const k = isEdit ? c.kind : $('kind').value;
          if (!name) return UI.fieldError(f, 'name', 'カテゴリ名を入力してください');
          if (data.categories.some((x) => x.kind === k && x.name === name && x.id !== c.id))
            return UI.fieldError(f, 'name', '同じ名前のカテゴリがあります');
          const rec = Object.assign({}, existing || { order: data.categories.length + 1 }, { name, kind: k, color: $('color').value });
          if (isEdit) rec.archived = $('archived').checked;
          if (await UI.guard(() => D.save('categories', rec))) { close(); UI.render(); UI.toast('保存しました'); }
        });
        const del = f.querySelector('[data-act=delete]');
        if (del)
          del.onclick = async () => {
            if (!(await UI.confirm(`カテゴリ「${c.name}」を削除しますか？`, { okLabel: '削除', danger: true }))) return;
            if (await UI.guard(() => D.remove('categories', existing))) { close(); UI.render(); }
          };
      },
    });
  };

  /** 並べ替え（上へ・下へ） */
  A.move = async function (store, list, id, dir) {
    const i = list.findIndex((x) => x.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= list.length) return;
    const arr = list.slice();
    [arr[i], arr[j]] = [arr[j], arr[i]];
    await UI.guard(() => D.saveMany(arr.map((x, k) => [store, Object.assign({}, x, { order: k + 1 })])));
    UI.render();
  };
})(window.KB = window.KB || {});

</script>
<script>
/* 画面：初回起動・ホーム・取引一覧・残高・引き落とし */
(function (KB) {
  'use strict';
  const U = KB.util, UI = KB.ui, B = KB.balance, C = KB.credit, R = KB.report, D = KB.db, A = KB.actions;
  const V = UI.views;

  const txLabel = (model, t) => {
    if (t.type === 'transfer') {
      const to = model.accById.get(t.toAccountId);
      return `振替 → ${U.esc(to ? to.name : '')}`;
    }
    if (t.type === 'adjust') return '残高調整（使途不明）';
    const c = model.catById.get(t.categoryId);
    return `<span class="dot" style="background:${U.esc(c && c.color ? c.color : '#8c959f')}"></span>${U.esc(c ? c.name : '（未分類）')}`;
  };
  const txAmount = (t) =>
    t.type === 'income' ? UI.signed(t.amount, 'income') :
    t.type === 'expense' ? UI.signed(t.amount, 'expense') :
    t.type === 'adjust' ? `<span class="amt ${t.amount < 0 ? 'exp' : 'inc'}">${t.amount < 0 ? '−' : '+'}${U.num(Math.abs(t.amount))}</span>` :
    `<span class="amt">${U.num(t.amount)}</span>`;

  // opts.wdMessage：引き落とし日が未設定のカード利用に案内文を出す（ホーム）
  function txRows(model, txs, opts) {
    if (!txs.length) return '<p class="empty">取引はありません</p>';
    const wdMessage = opts && opts.wdMessage;
    return `<table class="list"><thead><tr><th>日付</th><th>内容</th><th class="hide-sm">口座</th><th class="r">金額</th></tr></thead><tbody>
      ${txs.map((t) => {
        const acc = model.accById.get(t.accountId);
        const unset = C.isUnset(t, model.accById);
        const wd = t.withdrawDate && acc && acc.kind === 'credit' ? `<span class="tag">引落 ${U.md(t.withdrawDate)}</span>`
          : unset ? '<span class="tag bad">引落日 未設定</span>' : '';
        const msg = unset && wdMessage ? '<div class="wd-missing">引き落とし日が未設定です。分かり次第後日入力してください。</div>' : '';
        return `<tr data-tx="${t.id}" class="clickable ${unset && wdMessage ? 'row-warn' : ''}">
          <td class="nowrap">${U.mdw(t.date)}</td>
          <td>${txLabel(model, t)} ${wd}${t.memo ? `<div class="sub">${U.esc(t.memo)}</div>` : ''}${msg}<div class="sub show-sm">${U.esc(acc ? acc.name : '')}</div></td>
          <td class="hide-sm">${U.esc(acc ? acc.name : '')}</td>
          <td class="r nowrap">${txAmount(t)}</td></tr>`;
      }).join('')}</tbody></table>`;
  }
  function bindTxRows(root, data) {
    root.querySelectorAll('tr[data-tx]').forEach((tr) =>
      tr.addEventListener('click', () => A.openTx(data.transactions.find((t) => t.id === tr.dataset.tx)))
    );
  }
  const sortTx = (a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (a.createdAt || '') < (b.createdAt || '') ? 1 : -1);

  /* ================= 初回起動 ================= */
  V.setup = function (root) {
    const today = U.todayStr();
    root.innerHTML = `<div class="setup card">
      <h1>はじめに</h1>
      <p>この家計簿は「<b>いつ時点で、いくらあったか</b>」を登録して始めます。月の途中からでも大丈夫です。</p>
      <p>まず、財布などの口座を1つ作り、今の残高を入れてください。口座はあとから「設定」で追加できます。</p>
      <form id="setup-form" novalidate>
        <div class="grid2">
          <label class="field"><span>口座名</span><input name="name" value="財布" maxlength="40"><small class="err" data-err="name" hidden></small></label>
          <label class="field"><span>種類</span><select name="kind">${Object.entries(UI.KIND).filter(([k]) => k !== 'credit').map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></label>
          <label class="field"><span>日付</span><input type="date" name="date" value="${today}"><small class="err" data-err="date" hidden></small></label>
          <div class="field"><span>いつ時点</span><div class="seg small">
            <label><input type="radio" name="timing" value="start"><span>朝（その日の取引前）</span></label>
            <label><input type="radio" name="timing" value="end" checked><span>夜（その日の取引後）</span></label></div></div>
        </div>
        <label class="field"><span>その時点の残高（円）</span><span class="amount-row"><input type="tel" name="amount" inputmode="numeric" data-num autocomplete="off" placeholder="例 30000"><button type="button" class="btn sign-btn" data-sign="amount" title="プラス・マイナスを切り替え">＋/−</button></span><small class="err" data-err="amount" hidden></small></label>
        <div class="actions"><button type="submit" class="btn primary">はじめる</button></div>
      </form>
      <p class="hint">以前のバックアップがある場合は <a href="#" id="setup-restore">バックアップから復元</a></p>
      <input type="file" id="setup-file" accept=".json,application/json" hidden>
    </div>`;
    const f = root.querySelector('#setup-form');
    UI.bindNumInputs(f);
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      ['name', 'date', 'amount'].forEach((n) => UI.fieldError(f, n, ''));
      const name = U.cleanText(f.elements.name.value);
      const date = f.elements.date.value;
      const a = U.parseAmount(f.elements.amount.value, { allowNegative: true });
      let ok = true;
      if (!name) { UI.fieldError(f, 'name', '口座名を入力してください'); ok = false; }
      if (!U.isValidDate(date)) { UI.fieldError(f, 'date', '日付を入力してください'); ok = false; }
      if (a.error) { UI.fieldError(f, 'amount', a.error); ok = false; }
      if (!ok) return;
      const acc = { id: U.uuid(), name, kind: f.elements.kind.value, order: 1 };
      const pairs = [['accounts', acc], ['snapshots', { accountId: acc.id, date, timing: f.querySelector('input[name=timing]:checked').value, amount: a.value, memo: '' }]];
      if (KB.live().data.categories.length === 0) KB.io.defaultCategories().forEach((c) => pairs.push(['categories', c]));
      if (await UI.guard(() => D.saveMany(pairs))) {
        UI.go('');
        UI.toast('準備ができました。右下の＋から取引を入力できます');
      }
    });
    const file = root.querySelector('#setup-file');
    root.querySelector('#setup-restore').onclick = (e) => { e.preventDefault(); file.click(); };
    file.onchange = () => V.restoreFromFile(file);
  };

  /* ================= ホーム ================= */
  V.home = function (root) {
    const { data, model } = KB.live();
    const today = U.todayStr();
    const [y, m] = UI.thisYM();
    const accs = data.accounts.filter((a) => !a.archived);
    const total = B.totalAt(model, today, 'end', accs.map((a) => a.id));
    const mon = R.month(model, y, m);
    const cards = accs.filter((a) => a.kind === 'credit');
    const unsetAll = C.unsetItems(model);
    const diffs = [...model.diffs.values()].filter((d) => !d.first && d.diff !== 0);
    const recent = data.transactions.filter((t) => t.date <= today).sort(sortTx).slice(0, 10);
    const lastBackup = KB.state.settings.lastBackupAt;
    const needBackup = data.transactions.length > 0 && (!lastBackup || U.dayNum(today) - U.dayNum(lastBackup.slice(0, 10)) > 30);

    root.innerHTML = `
      ${needBackup ? `<div class="notice">${lastBackup ? '最後のバックアップから30日以上たっています。' : 'まだバックアップがありません。'}<a href="#config">設定</a>からバックアップを保存してください。</div>` : ''}
      ${diffs.length ? `<div class="notice warn">残高の登録に、帳簿との差額が ${diffs.length} 件あります。<a href="#balance">残高画面で確認</a></div>` : ''}
      <div class="cols">
        <section class="card">
          <div class="card-head"><h2>今日の残高</h2><span class="muted">${U.ymd(today)}（${U.weekday(today)}）夜時点</span></div>
          <table class="kv">${accs.map((a) => `<tr><th>${U.esc(a.name)} <span class="tag kind">${UI.KIND[a.kind]}</span></th>
            <td class="r">${UI.balanceHTML(B.balanceAt(model, a.id, today, 'end'))}</td></tr>`).join('')}
            <tr class="total"><th>合計</th><td class="r"><span class="amt ${total.value < 0 ? 'neg' : ''}">${U.yen(total.value)}</span>${total.estimated ? ' <span class="tag est">推定を含む</span>' : ''}</td></tr>
          </table>
          ${total.unknown ? `<p class="hint">残高未登録の口座が ${total.unknown} 件あり、合計に含めていません。</p>` : ''}
          <div class="actions left"><button class="btn" id="home-snap">残高を登録</button></div>
        </section>
        <section class="card">
          <div class="card-head"><h2>${m}月の収支</h2><a href="#report-${y}-${m}">月次レポート</a></div>
          <div class="stats">
            <div><span>収入</span><b class="inc">${U.yen(mon.income)}</b></div>
            <div><span>支出</span><b class="exp">${U.yen(mon.expense)}</b></div>
            <div><span>収支</span><b class="${mon.net < 0 ? 'neg' : ''}">${mon.net > 0 ? '+' : ''}${U.yen(mon.net)}</b></div>
          </div>
          ${cards.length ? `<h3>次の引き落とし</h3><table class="kv">${cards.map((c) => {
            const g = C.nextGroup(model, c.id, today);
            const bank = model.accById.get(c.settlementAccountId);
            return `<tr><th>${U.esc(c.name)}<div class="sub">${bank ? U.esc(bank.name) + 'から' : '引き落とし口座 未設定'}</div></th><td class="r">${g
              ? `${U.mdw(g.date)}　<b>${U.yen(g.total)}</b>${g.insufficient ? ' <span class="tag bad">残高不足</span>' : ''}`
              : '<span class="muted">予定なし</span>'}</td></tr>`;
          }).join('')}</table>` : ''}
        </section>
      </div>
      <section class="card">
        <div class="card-head"><h2>最近の取引</h2><a href="#list">すべて見る</a></div>
        ${unsetAll.length ? `<p class="wd-missing-sum">引き落とし日が未設定のカード利用が全部で ${unsetAll.length} 件あります。<a href="#withdraw">引き落とし画面で一覧を見る</a></p>` : ''}
        ${txRows(model, recent, { wdMessage: true })}
      </section>`;
    root.querySelector('#home-snap').onclick = () => A.openSnapshot();
    bindTxRows(root, data);
  };

  /* ================= 取引一覧 ================= */
  const listFilter = {};
  V.list = function (root) {
    const { data, model } = KB.live();
    const [y, m] = UI.thisYM();
    const f = Object.assign({ from: U.monthStart(y, m), to: U.monthEnd(y, m), acc: '', cat: '', type: '', q: '' }, listFilter);
    const q = f.q.trim().toLowerCase();
    const txs = data.transactions.filter((t) => {
      if (f.from && t.date < f.from) return false;
      if (f.to && t.date > f.to) return false;
      if (f.acc && t.accountId !== f.acc && t.toAccountId !== f.acc) return false;
      if (f.cat && t.categoryId !== f.cat) return false;
      if (f.type && t.type !== f.type) return false;
      if (q) {
        const c = model.catById.get(t.categoryId);
        const hay = [(t.memo || ''), c ? c.name : '', String(t.amount)].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    }).sort(sortTx);
    const inc = U.sum(txs.filter((t) => t.type === 'income'), (t) => t.amount);
    const exp = U.sum(txs.filter((t) => t.type === 'expense'), (t) => t.amount);
    const cats = data.categories;
    root.innerHTML = `
      <section class="card no-print">
        <form class="filters" id="flt">
          <label class="field"><span>期間</span><span class="range"><input type="date" name="from" value="${f.from}"> 〜 <input type="date" name="to" value="${f.to}"></span></label>
          <label class="field"><span>口座</span><select name="acc">${UI.accountOptions(data.accounts, f.acc, { empty: 'すべて' })}</select></label>
          <label class="field"><span>カテゴリ</span><select name="cat"><option value="">すべて</option>
            <optgroup label="支出">${UI.categoryOptions(cats.filter((c) => c.kind === 'expense'), f.cat)}</optgroup>
            <optgroup label="収入">${UI.categoryOptions(cats.filter((c) => c.kind === 'income'), f.cat)}</optgroup></select></label>
          <label class="field"><span>種類</span><select name="type">${[['', 'すべて'], ['expense', '支出'], ['income', '収入'], ['transfer', '振替'], ['adjust', '調整']]
            .map(([v, l]) => `<option value="${v}" ${f.type === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
          <label class="field grow"><span>キーワード</span><input type="search" name="q" value="${U.esc(f.q)}" placeholder="メモ・カテゴリ・金額"></label>
          <div class="field"><span>&nbsp;</span><button type="button" class="btn small" id="flt-reset">条件をリセット</button></div>
        </form>
      </section>
      <section class="card">
        <div class="card-head"><h2>取引一覧</h2><span class="muted">${txs.length}件　収入 <b class="inc">${U.yen(inc)}</b>　支出 <b class="exp">${U.yen(exp)}</b></span></div>
        ${txRows(model, txs)}
      </section>`;
    const form = root.querySelector('#flt');
    form.addEventListener('change', () => {
      ['from', 'to', 'acc', 'cat', 'type'].forEach((k) => (listFilter[k] = form.elements[k].value));
      V.list(root);
    });
    let timer;
    form.elements.q.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        listFilter.q = form.elements.q.value;
        V.list(root);
        const qi = root.querySelector('input[name=q]');
        qi.focus();
        qi.setSelectionRange(qi.value.length, qi.value.length);
      }, 300);
    });
    root.querySelector('#flt-reset').onclick = () => {
      Object.keys(listFilter).forEach((k) => delete listFilter[k]);
      V.list(root);
    };
    bindTxRows(root, data);
  };

  /* ================= 残高 ================= */
  const balQuery = {};
  V.balance = function (root) {
    const { data, model } = KB.live();
    const qd = balQuery.date || U.todayStr();
    const qt = balQuery.timing || 'end';
    const accs = data.accounts.filter((a) => !a.archived || (model.perAcc.get(a.id) || {}).snaps.length);
    const total = B.totalAt(model, qd, qt, accs.map((a) => a.id));
    root.innerHTML = `
      <section class="card">
        <div class="card-head"><h2>指定した日の残高</h2><button class="btn primary" id="bal-new">残高を登録</button></div>
        <div class="filters">
          <label class="field"><span>日付</span><input type="date" id="bq-date" value="${qd}"></label>
          <label class="field"><span>時点</span><select id="bq-timing"><option value="start" ${qt === 'start' ? 'selected' : ''}>朝（その日の取引前）</option><option value="end" ${qt === 'end' ? 'selected' : ''}>夜（その日の取引後）</option></select></label>
        </div>
        <table class="kv">${accs.map((a) => `<tr><th>${U.esc(a.name)}</th><td class="r">${UI.balanceHTML(B.balanceAt(model, a.id, qd, qt))}</td></tr>`).join('')}
          <tr class="total"><th>合計</th><td class="r"><span class="amt">${U.yen(total.value)}</span>${total.estimated ? ' <span class="tag est">推定を含む</span>' : ''}</td></tr></table>
        ${total.unknown ? `<p class="hint">残高未登録の口座が ${total.unknown} 件あり、合計に含めていません。</p>` : ''}
      </section>
      ${accs.map((a) => {
        const ds = B.snapshotDiffs(model, a.id).slice().reverse();
        return `<section class="card">
          <div class="card-head"><h2>${U.esc(a.name)} <span class="tag kind">${UI.KIND[a.kind]}</span></h2>
            <button class="btn small" data-snap-new="${a.id}">この口座の残高を登録</button></div>
          ${ds.length === 0 ? '<p class="empty">まだ残高が登録されていません。登録すると、その日からの残高が計算されます。</p>' :
          `<table class="list"><thead><tr><th>いつ時点</th><th class="r">登録した残高</th><th class="r hide-sm">帳簿の計算</th><th class="r">差額</th><th></th></tr></thead><tbody>
          ${ds.map((d) => {
            const s = d.snap;
            let diffCell, act = '';
            if (d.first) diffCell = '<span class="muted">起点</span>';
            else if (d.diff === 0 && d.adjSum === 0) diffCell = '<span class="ok-text">一致</span>';
            else if (d.diff === 0) diffCell = `<span class="ok-text">調整済</span><div class="sub">${U.yen(d.adjSum)}</div>`;
            else diffCell = `<span class="tag bad">差額あり</span><div class="neg">${d.diff > 0 ? '+' : ''}${U.yen(d.diff)}</div>`;
            if (!d.first && d.diff !== 0) act += `<button class="btn small" data-adj="${s.id}">${d.adjSum ? '調整をやり直す' : '調整として記録'}</button>`;
            if (d.adjSum && d.diff === 0) act += `<button class="btn small ghost" data-unadj="${s.id}">調整を取り消す</button>`;
            return `<tr><td class="nowrap">${U.ymd(s.date)}（${U.weekday(s.date)}）<span class="tag">${s.timing === 'start' ? '朝' : '夜'}</span>${s.memo ? `<div class="sub">${U.esc(s.memo)}</div>` : ''}</td>
              <td class="r nowrap">${U.yen(s.amount)}</td>
              <td class="r nowrap hide-sm">${d.first ? '—' : U.yen(d.expected - d.adjSum)}</td>
              <td class="r nowrap">${diffCell}</td>
              <td class="r actions-cell">${act}<button class="btn small ghost" data-snap-edit="${s.id}">編集</button></td></tr>`;
          }).join('')}</tbody></table>`}
        </section>`;
      }).join('')}`;
    root.querySelector('#bal-new').onclick = () => A.openSnapshot();
    const qdi = root.querySelector('#bq-date'), qti = root.querySelector('#bq-timing');
    const upd = () => { if (U.isValidDate(qdi.value)) { balQuery.date = qdi.value; balQuery.timing = qti.value; V.balance(root); } };
    qdi.onchange = upd; qti.onchange = upd;
    root.querySelectorAll('[data-snap-new]').forEach((b) => (b.onclick = () => A.openSnapshot(null, { accountId: b.dataset.snapNew })));
    root.querySelectorAll('[data-snap-edit]').forEach((b) => (b.onclick = () => A.openSnapshot(data.snapshots.find((s) => s.id === b.dataset.snapEdit))));
    root.querySelectorAll('[data-adj]').forEach((b) => (b.onclick = async () => {
      const d = model.diffs.get(b.dataset.adj);
      const yes = await UI.confirm(`差額 ${d.rawDiff > 0 ? '+' : ''}${U.yen(d.rawDiff)} を「調整（使途不明）」として記録しますか？\n記入漏れが見つかった場合は、先に取引を追加してください。`, { okLabel: '記録する' });
      if (yes && (await UI.guard(() => A.setAdjust(b.dataset.adj, true)))) { UI.render(); UI.toast('調整を記録しました'); }
    }));
    root.querySelectorAll('[data-unadj]').forEach((b) => (b.onclick = async () => {
      if (await UI.confirm('この残高登録の調整を取り消しますか？', { okLabel: '取り消す' }))
        if (await UI.guard(() => A.setAdjust(b.dataset.unadj, false))) UI.render();
    }));
  };

  /* ================= 引き落とし ================= */
  V.withdraw = function (root) {
    const { data, model } = KB.live();
    const today = U.todayStr();
    const cards = data.accounts.filter((a) => a.kind === 'credit');
    const groupHTML = (g, open) => `<details class="wd" ${open ? 'open' : ''}>
      <summary><span class="wd-date">${U.ymd(g.date)}（${U.weekday(g.date)}）</span>
        <span class="wd-total">${U.yen(g.total)}</span><span class="muted">${g.count}件</span>
        ${g.insufficient ? `<span class="tag bad" title="引き落とし日の夜の残高 ${U.yen(g.bankBalance.value)}">残高不足</span>` : ''}</summary>
      <table class="list"><thead><tr><th>利用日</th><th>内容</th><th class="r">金額</th></tr></thead><tbody>
      ${g.items.map((t) => `<tr class="clickable" data-tx="${t.id}"><td class="nowrap">${U.mdw(t.date)}</td><td>${txLabel(model, t)}${t.memo ? `<div class="sub">${U.esc(t.memo)}</div>` : ''}</td>
        <td class="r nowrap">${t.type === 'income' ? '−' : ''}${U.num(t.amount)}</td></tr>`).join('')}</tbody></table></details>`;
    root.innerHTML = cards.length === 0
      ? `<section class="card"><h2>引き落とし</h2><p class="empty">クレジットカードの口座がありません。<a href="#config">設定</a>で種類「クレジットカード」の口座を追加してください。</p></section>`
      : cards.map((c) => {
        const auto = B.isAutoCard(c, model.accById);
        const gs = C.groups(model, c.id);
        const up = gs.filter((g) => g.date >= today);
        const past = gs.filter((g) => g.date < today).reverse();
        const bank = auto ? model.accById.get(c.settlementAccountId) : null;
        const unset = C.unsetItems(model, c.id);
        return `<section class="card">
          <div class="card-head"><h2>${U.esc(c.name)}</h2><span class="muted">引き落とし口座：${bank ? U.esc(bank.name) : '未設定'}</span></div>
          ${auto ? '' : '<p class="notice warn">引き落とし口座が未設定のため、引き落とし日に銀行の残高から自動では引かれません。<a href="#config">設定</a>で引き落とし口座を選んでください。</p>'}
          ${unset.length ? `<h3 class="neg">引き落とし日が未設定（${unset.length}件・${U.yen(U.sum(unset, (t) => (t.type === 'expense' ? t.amount : -t.amount)))}）</h3>
            <p class="hint">分かり次第、行を押して引き落とし日を入力してください。</p>
            <table class="list"><thead><tr><th>利用日</th><th>内容</th><th class="r">金額</th></tr></thead><tbody>
            ${unset.map((t) => `<tr class="clickable" data-tx="${t.id}"><td class="nowrap">${U.mdw(t.date)}</td><td>${txLabel(model, t)}${t.memo ? `<div class="sub">${U.esc(t.memo)}</div>` : ''}</td>
              <td class="r nowrap">${t.type === 'income' ? '−' : ''}${U.num(t.amount)}</td></tr>`).join('')}</tbody></table>` : ''}
          <h3>これからの引き落とし</h3>
          ${up.length ? up.map((g, i) => groupHTML(g, i === 0)).join('') : '<p class="empty">予定はありません</p>'}
          ${past.length ? `<details class="past"><summary>済んだ引き落とし（${past.length}回）</summary>${past.map((g) => groupHTML(g, false)).join('')}</details>` : ''}
        </section>`;
      }).join('');
    bindTxRows(root, data);
  };

  /* 復元（設定画面・初回起動から使う） */
  V.restoreFromFile = function (input) {
    const file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    const r = new FileReader();
    r.onload = async () => {
      const res = KB.io.parseBackup(r.result);
      if (res.error) return UI.toast(res.error, 'error');
      const s = res.summary;
      const yes = await UI.confirm(
        `バックアップ（${s.exportedAt ? U.ymd(s.exportedAt.slice(0, 10)) : '日付不明'}保存）を復元します。\n口座 ${s.accounts}件・取引 ${s.transactions}件・残高登録 ${s.snapshots}件\n\n現在のデータはすべて置き換わります。よろしいですか？`,
        { okLabel: '置き換えて復元', danger: true }
      );
      if (!yes) return;
      if (await UI.guard(() => D.replaceAll(res.data))) {
        UI.go('');
        UI.toast('復元しました');
      }
    };
    r.onerror = () => UI.toast('ファイルを読めませんでした', 'error');
    r.readAsText(file);
  };
})(window.KB = window.KB || {});

</script>
<script>
/* 画面：月次レポート・年次レポート・出納帳・設定 */
(function (KB) {
  'use strict';
  const U = KB.util, UI = KB.ui, B = KB.balance, R = KB.report, L = KB.ledger, D = KB.db, A = KB.actions, IO = KB.io;
  const V = UI.views;

  const balText = (b) => (b.status === 'unknown' ? '不明' : U.num(b.value) + (b.status === 'estimated' ? '（推定）' : ''));
  const totText = (t) => U.num(t.value) + (t.estimated ? '（推定を含む）' : '');
  const yenCell = (v, cls) => `<td class="r nowrap ${v ? cls || '' : 'muted'} ${v < 0 ? 'neg' : ''}">${U.num(v)}</td>`;

  function summaryRows(p) {
    return [
      ['期首の残高', p.open.value, p.open.estimated ? '推定を含む' : ''],
      ['収入', p.income, ''], ['支出', p.expense, ''], ['調整（使途不明）', p.adjust, ''],
      ['未調整の差額', p.unadjusted, p.unadjusted ? '残高画面で確認' : ''],
      ['期末の残高', p.close.value, p.close.estimated ? '推定を含む' : ''],
    ];
  }

  /* ================= 月次レポート ================= */
  V.report = function (root, params) {
    const { data, model } = KB.live();
    const [ty, tm] = UI.thisYM();
    const y = +params.y || ty, m = +params.m || tm;
    const p = R.month(model, y, m);
    const nav = UI.monthNav(y, m);
    const exp = data.categories.filter((c) => c.kind === 'expense');
    const catRows = (map, cats) => {
      const ids = new Set(cats.map((c) => c.id));
      map.forEach((_, id) => ids.add(id));
      const total = U.sum([...map.values()]);
      return [...ids].map((id) => ({ id, cat: model.catById.get(id), v: map.get(id) || 0 }))
        .filter((r) => r.v || (r.cat && !r.cat.archived))
        .sort((a, b) => b.v - a.v)
        .map((r) => ({ name: r.cat ? r.cat.name : '（未分類）', color: r.cat && r.cat.color, v: r.v, share: total ? r.v / total : 0 }));
    };
    const er = catRows(p.expByCat, exp);
    const ir = catRows(p.incByCat, data.categories.filter((c) => c.kind === 'income'));
    const labels = ['月初の残高', '収入', '支出', '調整（使途不明）', '未調整の差額', '月末の残高'];
    const sr = summaryRows(p).map((r, i) => [labels[i]].concat(r.slice(1)));
    root.innerHTML = `
      <div class="pager no-print"><a class="btn small" href="#report-${nav.prev[0]}-${nav.prev[1]}">‹ 前月</a>
        <h1>${y}年${m}月</h1><a class="btn small" href="#report-${nav.next[0]}-${nav.next[1]}">翌月 ›</a></div>
      <section class="card" id="rp-sum">
        <div class="card-head"><h2>${y}年${m}月の収支</h2>${UI.toolButtons('rp-sum')}</div>
        <h1 class="print-only">${y}年${m}月 月次レポート</h1>
        <table class="kv">${sr.map(([l, v, note], i) => `<tr class="${i === 0 || i === 5 ? 'total' : ''}"><th>${l}</th><td class="r"><span class="amt ${v < 0 ? 'neg' : ''}">${U.yen(v)}</span>${note ? ` <span class="tag ${i === 4 ? 'bad' : 'est'}">${note}</span>` : ''}</td></tr>`).join('')}</table>
        ${p.open.unknown ? `<p class="hint">残高未登録の口座が ${p.open.unknown} 件あり、残高の合計に含めていません。</p>` : ''}
        <h3>口座別</h3>
        <table class="list"><thead><tr><th>口座</th><th class="r">月初</th><th class="r">月末</th><th class="r">増減</th></tr></thead><tbody>
        ${p.byAccount.filter((r) => !r.account.archived || r.open.status !== 'unknown').map((r) => `<tr><td>${U.esc(r.account.name)}</td><td class="r">${UI.balanceHTML(r.open)}</td><td class="r">${UI.balanceHTML(r.close)}</td>
          <td class="r nowrap">${r.open.status !== 'unknown' && r.close.status !== 'unknown' ? U.num(r.close.value - r.open.value) : '—'}</td></tr>`).join('')}</tbody></table>
      </section>
      <div class="cols">
        <section class="card" id="rp-exp"><div class="card-head"><h2>カテゴリ別の支出</h2>${UI.toolButtons('rp-exp')}</div>
          <h1 class="print-only">${y}年${m}月 カテゴリ別の支出</h1>${barTable(er, p.expense)}</section>
        <section class="card" id="rp-inc"><div class="card-head"><h2>カテゴリ別の収入</h2>${UI.toolButtons('rp-inc')}</div>
          <h1 class="print-only">${y}年${m}月 カテゴリ別の収入</h1>${barTable(ir, p.income)}</section>
      </div>`;
    const ym = `${y}-${U.pad(m)}`;
    UI.bindTools(root, {
      'rp-sum': () => U.download(`月次レポート_${ym}.csv`, U.csv([['項目', '金額（円）']].concat(sr.map(([l, v]) => [l, v]))
        .concat([[], ['口座', '月初', '月末']]).concat(p.byAccount.map((r) => [r.account.name, balText(r.open), balText(r.close)])))),
      'rp-exp': () => U.download(`カテゴリ別支出_${ym}.csv`, U.csv([['カテゴリ', '金額（円）', '割合']].concat(er.map((r) => [r.name, r.v, (r.share * 100).toFixed(1) + '%'])))),
      'rp-inc': () => U.download(`カテゴリ別収入_${ym}.csv`, U.csv([['カテゴリ', '金額（円）', '割合']].concat(ir.map((r) => [r.name, r.v, (r.share * 100).toFixed(1) + '%'])))),
    });
  };

  function barTable(rows, total) {
    if (!total) return '<p class="empty">この月はまだありません</p>';
    return `<table class="list bars"><tbody>${rows.filter((r) => r.v).map((r) => `<tr><td class="nowrap"><span class="dot" style="background:${U.esc(r.color || '#8c959f')}"></span>${U.esc(r.name)}</td>
      <td class="bar-cell"><span class="bar" style="width:${(r.share * 100).toFixed(1)}%;background:${U.esc(r.color || '#8c959f')}"></span></td>
      <td class="r nowrap">${U.yen(r.v)}</td><td class="r muted nowrap">${(r.share * 100).toFixed(1)}%</td></tr>`).join('')}
      <tr class="total"><td>合計</td><td></td><td class="r nowrap">${U.yen(total)}</td><td></td></tr></tbody></table>`;
  }

  /* ================= 年次レポート ================= */
  V.annual = function (root, params) {
    const { model } = KB.live();
    const y = +params.y || UI.thisYM()[0];
    const r = R.year(model, y);
    const t = r.total;
    const labels = ['年初の残高（1/1 朝）', '年間の収入', '年間の支出', '調整（使途不明）', '未調整の差額', '年末の残高（12/31 夜）'];
    const sr = summaryRows(t).map((x, i) => [labels[i]].concat(x.slice(1)));
    const catTable = (rows, title) => `<div class="scroll"><table class="list wide-num"><thead><tr><th>${title}</th>${r.months.map((_, i) => `<th class="r">${i + 1}月</th>`).join('')}<th class="r">年計</th></tr></thead><tbody>
      ${rows.map((x) => `<tr><td class="nowrap">${U.esc(x.name)}</td>${x.vals.map((v) => `<td class="r">${v ? U.num(v) : ''}</td>`).join('')}<td class="r"><b>${U.num(x.total)}</b></td></tr>`).join('')}
      <tr class="total"><td>合計</td>${r.months.map((_, i) => `<td class="r">${U.num(U.sum(rows, (x) => x.vals[i]))}</td>`).join('')}<td class="r">${U.num(U.sum(rows, (x) => x.total))}</td></tr></tbody></table></div>`;
    root.innerHTML = `
      <div class="pager no-print"><a class="btn small" href="#annual-${y - 1}">‹ 前年</a><h1>${y}年</h1><a class="btn small" href="#annual-${y + 1}">翌年 ›</a></div>
      <div class="cols">
        <section class="card" id="an-sum"><div class="card-head"><h2>年間サマリー</h2>${UI.toolButtons('an-sum')}</div>
          <h1 class="print-only">${y}年 年間サマリー</h1>
          <table class="kv">${sr.map(([l, v, note], i) => `<tr class="${i === 0 || i === 5 ? 'total' : ''}"><th>${l}</th><td class="r"><span class="amt ${v < 0 ? 'neg' : ''}">${U.yen(v)}</span>${note ? ` <span class="tag ${i === 4 ? 'bad' : 'est'}">${note}</span>` : ''}</td></tr>`).join('')}</table>
          ${t.open.unknown ? `<p class="hint">残高未登録の口座が ${t.open.unknown} 件あり、残高の合計に含めていません。</p>` : ''}
          <h3>口座別</h3>
          <table class="list"><thead><tr><th>口座</th><th class="r">年初</th><th class="r">年末</th></tr></thead><tbody>
          ${t.byAccount.filter((x) => !x.account.archived || x.open.status !== 'unknown').map((x) => `<tr><td>${U.esc(x.account.name)}</td><td class="r">${UI.balanceHTML(x.open)}</td><td class="r">${UI.balanceHTML(x.close)}</td></tr>`).join('')}</tbody></table>
        </section>
        <section class="card" id="an-mon"><div class="card-head"><h2>月別の推移</h2>${UI.toolButtons('an-mon')}</div>
          <h1 class="print-only">${y}年 月別の推移</h1>
          <table class="list"><thead><tr><th>月</th><th class="r">収入</th><th class="r">支出</th><th class="r">収支</th><th class="r">月末の残高</th></tr></thead><tbody>
          ${r.months.map((p, i) => `<tr><td><a href="#report-${y}-${i + 1}">${i + 1}月</a></td>${yenCell(p.income, 'inc')}${yenCell(p.expense, 'exp')}${yenCell(p.net)}
            <td class="r nowrap">${U.num(p.close.value)}${p.close.estimated ? ' <span class="tag est">推定</span>' : ''}</td></tr>`).join('')}
          <tr class="total"><td>年計</td>${yenCell(t.income)}${yenCell(t.expense)}${yenCell(t.net)}<td class="r">${U.num(t.close.value)}</td></tr></tbody></table>
        </section>
      </div>
      <section class="card print-wide" id="an-exp"><div class="card-head"><h2>カテゴリ別の年間支出</h2>${UI.toolButtons('an-exp')}</div>
        <h1 class="print-only">${y}年 カテゴリ別の年間支出（円）</h1>${catTable(r.expenseRows, '支出')}</section>
      <section class="card print-wide" id="an-inc"><div class="card-head"><h2>カテゴリ別の年間収入</h2>${UI.toolButtons('an-inc')}</div>
        <h1 class="print-only">${y}年 カテゴリ別の年間収入（円）</h1>${catTable(r.incomeRows, '収入')}</section>`;
    const head = ['カテゴリ'].concat(r.months.map((_, i) => `${i + 1}月`), ['年計']);
    const catCsv = (rows) => U.csv([head].concat(rows.map((x) => [x.name].concat(x.vals, [x.total])),
      [['合計'].concat(r.months.map((_, i) => U.sum(rows, (x) => x.vals[i])), [U.sum(rows, (x) => x.total)])]));
    UI.bindTools(root, {
      'an-sum': () => U.download(`年間サマリー_${y}.csv`, U.csv([['項目', '金額（円）']].concat(sr.map(([l, v]) => [l, v]))
        .concat([[], ['口座', '年初', '年末']]).concat(t.byAccount.map((x) => [x.account.name, balText(x.open), balText(x.close)])))),
      'an-mon': () => U.download(`月別推移_${y}.csv`, U.csv([['月', '収入', '支出', '収支', '月末の残高']]
        .concat(r.months.map((p, i) => [`${i + 1}月`, p.income, p.expense, p.net, totText(p.close)]))
        .concat([['年計', t.income, t.expense, t.net, totText(t.close)]]))),
      'an-exp': () => U.download(`カテゴリ別年間支出_${y}.csv`, catCsv(r.expenseRows)),
      'an-inc': () => U.download(`カテゴリ別年間収入_${y}.csv`, catCsv(r.incomeRows)),
    });
  };

  /* ================= 出納帳 ================= */
  const ledgerState = {};
  V.ledger = function (root) {
    const { data, model } = KB.live();
    const [ty, tm] = UI.thisYM();
    const st = Object.assign({ acc: (data.accounts.find((a) => !a.archived) || data.accounts[0]).id, mode: 'year', y: ty, m: tm,
      from: U.monthStart(ty, tm), to: U.monthEnd(ty, tm) }, ledgerState);
    if (!model.accById.has(st.acc)) st.acc = data.accounts[0].id;
    let from, to, label;
    if (st.mode === 'year') { from = `${st.y}-01-01`; to = `${st.y}-12-31`; label = `${st.y}年`; }
    else if (st.mode === 'month') { from = U.monthStart(st.y, st.m); to = U.monthEnd(st.y, st.m); label = `${st.y}年${st.m}月`; }
    else { from = st.from; to = st.to < st.from ? st.from : st.to; label = `${U.ymd(from)}〜${U.ymd(to)}`; }
    const led = L.build(model, st.acc, from, to);
    const acc = led.account;
    const years = [];
    for (let yy = ty + 1; yy >= ty - 10; yy--) years.push(yy);
    const markHTML = (r) => r.mark === 'ok' ? '<span class="mark ok">照合済</span>' : r.mark === 'diff' ? `<span class="mark bad">差額あり</span>` : '';
    const rowHTML = (r) => {
      if (r.type === 'carry')
        return `<tr class="carry"><td class="nowrap">${U.md(r.date)}</td><td>${r.desc}</td><td></td><td></td>
          <td class="r nowrap">${r.balance == null ? '不明' : U.num(r.balance)}${r.status === 'estimated' ? '<span class="tag est">推定</span>' : ''}</td><td>${markHTML(r)}</td></tr>`;
      if (r.type === 'monthTotal' || r.type === 'cumTotal')
        return `<tr class="${r.type === 'monthTotal' ? 'subtotal' : 'cumtotal'}"><td></td><td>${+r.ym.slice(5)}月 ${r.type === 'monthTotal' ? '月計' : '累計'}</td>
          <td class="r">${U.num(r.in)}</td><td class="r">${U.num(r.out)}</td><td></td><td></td></tr>`;
      return `<tr class="${r.txId ? 'clickable' : ''} ${r.type === 'gap' ? 'gap' : ''}" ${r.txId ? `data-tx="${r.txId}"` : ''}>
        <td class="nowrap">${U.md(r.date)}</td><td>${U.esc(r.desc)}</td>
        <td class="r">${r.in ? U.num(r.in) : ''}</td><td class="r">${r.out ? U.num(r.out) : ''}</td>
        <td class="r nowrap ${r.balance < 0 ? 'neg' : ''}">${r.balance == null ? '—' : U.num(r.balance)}</td><td>${markHTML(r)}</td></tr>`;
    };
    root.innerHTML = `
      <section class="card no-print">
        <form class="filters" id="lg">
          <label class="field"><span>口座</span><select name="acc">${UI.accountOptions(data.accounts, st.acc)}</select></label>
          <label class="field"><span>期間</span><select name="mode"><option value="year" ${st.mode === 'year' ? 'selected' : ''}>年</option><option value="month" ${st.mode === 'month' ? 'selected' : ''}>月</option><option value="range" ${st.mode === 'range' ? 'selected' : ''}>期間を指定</option></select></label>
          ${st.mode !== 'range' ? `<label class="field"><span>年</span><select name="y">${years.map((yy) => `<option ${yy === +st.y ? 'selected' : ''}>${yy}</option>`).join('')}</select></label>` : ''}
          ${st.mode === 'month' ? `<label class="field"><span>月</span><select name="m">${[...Array(12)].map((_, i) => `<option value="${i + 1}" ${i + 1 === +st.m ? 'selected' : ''}>${i + 1}月</option>`).join('')}</select></label>` : ''}
          ${st.mode === 'range' ? `<label class="field"><span>期間</span><span class="range"><input type="date" name="from" value="${st.from}"> 〜 <input type="date" name="to" value="${st.to}"></span></label>` : ''}
        </form>
      </section>
      <section class="card" id="ledger">
        <div class="card-head"><h2>${led.name}：${U.esc(acc.name)}<span class="muted">　${label}</span></h2>${UI.toolButtons('ledger')}</div>
        <div class="print-only print-head"><h1>${led.name}</h1><p>口座：${U.esc(acc.name)}　期間：${U.ymd(from)} 〜 ${U.ymd(to)}</p></div>
        <div class="scroll"><table class="list ledger"><thead><tr><th>月日</th><th>摘要</th><th class="r">入金</th><th class="r">出金</th><th class="r">差引残高</th><th class="mark-col"></th></tr></thead>
          <tbody>${led.rows.map(rowHTML).join('')}</tbody></table></div>
        <p class="hint">「照合済」は登録した残高と帳簿が一致した時点、「推定」は後の残高登録から逆算した値です。</p>
      </section>`;
    const f = root.querySelector('#lg');
    f.addEventListener('change', () => {
      ['acc', 'mode', 'y', 'm', 'from', 'to'].forEach((k) => { if (f.elements[k]) ledgerState[k] = f.elements[k].value; });
      V.ledger(root);
    });
    root.querySelectorAll('tr[data-tx]').forEach((tr) => tr.addEventListener('click', () => A.openTx(data.transactions.find((t) => t.id === tr.dataset.tx))));
    UI.bindTools(root, {
      ledger: () => {
        const rows = [[led.name, acc.name, `${from}〜${to}`], ['月日', '摘要', '入金', '出金', '差引残高', '照合']];
        led.rows.forEach((r) => {
          if (r.type === 'monthTotal' || r.type === 'cumTotal') rows.push(['', `${+r.ym.slice(5)}月 ${r.type === 'monthTotal' ? '月計' : '累計'}`, r.in, r.out, '', '']);
          else rows.push([r.date, r.desc, r.in || '', r.out || '', r.balance == null ? '' : r.balance,
            (r.status === 'estimated' ? '推定' : '') + (r.mark === 'ok' ? '照合済' : r.mark === 'diff' ? '差額あり' : '')]);
        });
        U.download(`${led.name}_${acc.name}_${from}_${to}.csv`, U.csv(rows));
      },
    });
  };

  /* ================= 設定 ================= */
  V.config = function (root) {
    const { data } = KB.live();
    const lb = KB.state.settings.lastBackupAt;
    const accRows = data.accounts.map((a, i) => {
      const bank = a.settlementAccountId && data.accounts.find((x) => x.id === a.settlementAccountId);
      return `<tr class="${a.archived ? 'archived' : ''}"><td>${U.esc(a.name)}${a.archived ? ' <span class="tag">非表示</span>' : ''}
        <div class="sub">${UI.KIND[a.kind]}${a.kind === 'credit' ? '　引き落とし：' + (bank ? U.esc(bank.name) : '未設定') : ''}</div></td>
        <td class="r actions-cell"><button class="btn small ghost" data-mv="accounts:${a.id}:-1" ${i === 0 ? 'disabled' : ''} aria-label="上へ">↑</button>
        <button class="btn small ghost" data-mv="accounts:${a.id}:1" ${i === data.accounts.length - 1 ? 'disabled' : ''} aria-label="下へ">↓</button>
        <button class="btn small" data-acc="${a.id}">編集</button></td></tr>`;
    }).join('');
    const catBlock = (kind, title) => {
      const list = data.categories.filter((c) => c.kind === kind);
      return `<h3>${title}</h3><table class="list"><tbody>${list.map((c, i) => `<tr class="${c.archived ? 'archived' : ''}">
        <td><span class="dot" style="background:${U.esc(c.color || '#8c959f')}"></span>${U.esc(c.name)}${c.archived ? ' <span class="tag">非表示</span>' : ''}</td>
        <td class="r actions-cell"><button class="btn small ghost" data-mv="categories:${c.id}:-1:${kind}" ${i === 0 ? 'disabled' : ''} aria-label="上へ">↑</button>
        <button class="btn small ghost" data-mv="categories:${c.id}:1:${kind}" ${i === list.length - 1 ? 'disabled' : ''} aria-label="下へ">↓</button>
        <button class="btn small" data-cat="${c.id}">編集</button></td></tr>`).join('')}</tbody></table>
        <div class="actions left"><button class="btn small" data-cat-new="${kind}">＋ ${title}カテゴリを追加</button></div>`;
    };
    root.innerHTML = `
      <div class="cols">
        <section class="card"><div class="card-head"><h2>口座</h2><button class="btn small primary" id="acc-new">＋ 口座を追加</button></div>
          <table class="list"><tbody>${accRows}</tbody></table></section>
        <section class="card"><h2>カテゴリ</h2>${catBlock('expense', '支出')}${catBlock('income', '収入')}</section>
      </div>
      <section class="card"><h2>データ</h2>
        <p>データはこのブラウザの中にだけ保存されています。ブラウザのデータ削除や機種変更に備えて、定期的にバックアップを保存してください。</p>
        <p class="muted">最後のバックアップ：${lb ? U.ymd(lb.slice(0, 10)) : 'まだありません'}</p>
        <div class="actions left wrap">
          <button class="btn primary" id="bk-save">バックアップを保存（JSON）</button>
          <button class="btn" id="bk-load">バックアップから復元</button>
          <button class="btn" id="csv-all">全取引をCSVで書き出す</button>
          <input type="file" id="bk-file" accept=".json,application/json" hidden>
        </div>
        <h3>全データの削除</h3>
        <p class="muted">口座・取引・残高・カテゴリをすべて削除し、最初の状態に戻します。</p>
        <button class="btn danger-ghost" id="wipe">全データを削除</button>
      </section>
      <section class="card"><h2>このアプリについて</h2>
        <p>家計簿 試用版 v1（同期なし）。${D.persistent ? '' : '<b class="neg">このブラウザではデータを保存できないため、閉じると消えます。</b>'}</p>
        <p><a href="test.html" target="_blank" rel="noopener">残高計算の自動テストを開く</a></p>
      </section>`;
    root.querySelector('#acc-new').onclick = () => A.openAccount();
    root.querySelectorAll('[data-acc]').forEach((b) => (b.onclick = () => A.openAccount(data.accounts.find((a) => a.id === b.dataset.acc))));
    root.querySelectorAll('[data-cat]').forEach((b) => (b.onclick = () => A.openCategory(data.categories.find((c) => c.id === b.dataset.cat))));
    root.querySelectorAll('[data-cat-new]').forEach((b) => (b.onclick = () => A.openCategory(null, b.dataset.catNew)));
    root.querySelectorAll('[data-mv]').forEach((b) => (b.onclick = () => {
      const [store, id, dir, kind] = b.dataset.mv.split(':');
      const list = store === 'accounts' ? data.accounts : data.categories.filter((c) => c.kind === kind);
      A.move(store, list, id, +dir);
    }));
    root.querySelector('#bk-save').onclick = async () => {
      const r = await U.download(`家計簿バックアップ_${U.todayStr()}.json`, IO.exportJSON(), 'application/json');
      if (r !== 'saved') return;
      await UI.guard(() => D.setSetting('lastBackupAt', U.now()));
      UI.render();
      UI.toast('バックアップを保存しました');
    };
    const file = root.querySelector('#bk-file');
    root.querySelector('#bk-load').onclick = () => file.click();
    file.onchange = () => V.restoreFromFile(file);
    root.querySelector('#csv-all').onclick = () => U.download(`全取引_${U.todayStr()}.csv`, IO.transactionsCSV());
    root.querySelector('#wipe').onclick = async () => {
      if (!(await UI.confirm('全データを削除します。元に戻せません。\n先にバックアップを保存しましたか？', { okLabel: '削除する', danger: true }))) return;
      if (!(await UI.confirm('本当に削除しますか？', { okLabel: '全データを削除', danger: true }))) return;
      if (await UI.guard(() => D.replaceAll({}))) { UI.go(''); UI.toast('全データを削除しました'); }
    };
  };
})(window.KB = window.KB || {});

</script>
<script>
/* 起動 */
(function (KB) {
  'use strict';
  const UI = KB.ui;

  async function start() {
    const ok = await KB.db.open();
    if (ok) {
      try {
        await KB.db.loadAll();
      } catch (e) {
        console.error(e);
        KB.db.persistent = false;
        KB.db.error = e;
      }
    }
    if (!KB.db.persistent) {
      const b = document.getElementById('banner');
      b.hidden = false;
      b.textContent = 'このブラウザではデータを保存できません（プライベートブラウズ等）。閉じると入力内容は消えます。';
    }
    KB.invalidate();
    document.getElementById('fab').addEventListener('click', () => KB.actions.openTx());
    window.addEventListener('hashchange', UI.render);
    // 日付が変わったら「今日」を更新
    let day = KB.util.todayStr();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && KB.util.todayStr() !== day) {
        day = KB.util.todayStr();
        UI.render();
      }
    });
    UI.render();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})(window.KB = window.KB || {});

</script>
</body>
</html>
